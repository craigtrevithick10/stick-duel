<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f2a4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Stick Duel">
<meta name="mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0}[hidden]{display:none!important}</style>
<title>Stick Duel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Rubik:wght@400;600;800&display=swap">
<style>
/* Layout: full-screen canvas duel; minimal grey/white/black look with blood-red accents. Single deliberate theme. */
:root{
  --dusk:#1f2a4a; --ember:#f2a65a; --ink:#141414; --bone:#f6eedf; --blood:#e23b2e; --muted:#b9b0c8;
  --pixel:'Silkscreen','Courier New',monospace;
  --body:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;background:var(--dusk)}
body{height:100%;margin:0;background:var(--dusk);color:var(--bone);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{position:relative;width:100%;height:100%;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
#pauseBtn{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:14px;width:44px;height:44px;border:0;background:none;cursor:pointer;padding:0;display:flex;gap:7px;align-items:center;justify-content:center}
#pauseBtn i{display:block;width:10px;height:30px;background:var(--bone);box-shadow:0 2px 0 rgba(0,0,0,.35)}
#musicBtn{position:absolute;right:calc(max(14px,env(safe-area-inset-right,0px)) + 54px);bottom:14px;width:44px;height:44px;border:0;background:none;cursor:pointer;padding:0;font:700 28px var(--body);color:var(--bone);text-shadow:0 2px 0 rgba(0,0,0,.35)}
#musicBtn.off{opacity:.35;text-decoration:line-through}
#homeBtn{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:14px;padding:10px 16px;border:0;cursor:pointer;font:700 14px var(--pixel);letter-spacing:.06em;color:#24150a;background:var(--ember);box-shadow:0 3px 0 rgba(0,0,0,.35)}
#homeBtn:focus-visible{outline:3px solid var(--blood);outline-offset:3px}
#quiver{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;display:flex;gap:6px}
#quiver button{min-width:62px;padding:6px 8px 5px;border:2px solid rgba(246,238,223,.25);background:rgba(20,14,30,.62);color:var(--bone);font:700 11px var(--pixel);letter-spacing:.04em;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1}
#quiver button small{font:700 11px var(--pixel);color:var(--bone)}
#quiver button.on{border-color:var(--ember);background:rgba(242,166,90,.28);box-shadow:0 0 0 2px rgba(242,166,90,.35)}
#quiver button.empty{opacity:.3;cursor:default}
#quiver{flex-wrap:wrap;justify-content:center}
#quiver .qhint{flex-basis:100%;text-align:center;font:700 11px var(--pixel);color:#7dffe8;letter-spacing:.06em;text-shadow:0 1px 3px #000;margin-bottom:2px}
#quiver button.link{border-color:#7dffe8;color:#7dffe8}
#quiver button.pickme{border-color:#7dffe8;animation:qpulse .8s ease-in-out infinite alternate}
#quiver.linking button[data-i="-1"]{opacity:.3}
@keyframes qpulse{to{box-shadow:0 0 0 3px rgba(125,255,232,.45)}}
#quiver .qi{font-size:20px;font-style:normal;line-height:1}
@media (max-width:700px){#quiver button{min-width:52px;padding:5px 5px 4px;font-size:10px}}
#pauseBtn:focus-visible,#musicBtn:focus-visible,.btn:focus-visible{outline:3px solid var(--blood);outline-offset:3px}
.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:rgba(22,18,38,.78);overflow-y:auto}
.panel{width:min(380px,100%);display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
.title{font-family:var(--pixel);font-weight:700;font-size:clamp(40px,10vw,62px);line-height:.95;margin:0;color:var(--bone);letter-spacing:.02em;text-wrap:balance}
.title em{font-style:normal;color:var(--blood)}
.how{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px;line-height:1.4;color:var(--muted);max-width:36ch}
.how b{color:var(--bone)}
.btn{font-family:var(--pixel);font-weight:700;font-size:20px;letter-spacing:.06em;color:#24150a;background:var(--ember);border:0;padding:14px 34px;cursor:pointer}
.btn:active{transform:translateY(2px)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.stat{background:rgba(246,238,223,.1);padding:10px 8px;display:flex;flex-direction:column;gap:4px}
.stat b{font-family:var(--pixel);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.small{font-size:12px;color:var(--muted);margin:0;letter-spacing:.08em;text-transform:uppercase}
.newbest{font-family:var(--pixel);color:var(--blood);margin:0}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;width:100%;max-height:calc(100vh - 200px);max-height:calc(100dvh - 200px);overflow-y:auto;padding:2px}
.shophead{grid-column:1/-1;margin:6px 0 0;font:700 11px var(--pixel);letter-spacing:.08em;color:rgba(246,238,223,.55);text-align:left}
.item.off{filter:grayscale(1);opacity:.3;padding:7px 10px;font-size:11px;cursor:default}
.item.off b{font-size:12px}
.item.off .cost{color:var(--bone)}
@media (max-height:520px){#shopScreen .panel{gap:8px}#shopScreen .title{font-size:24px!important}}
.item{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;padding:10px 12px;border:1px solid rgba(246,238,223,.18);background:rgba(246,238,223,.08);color:var(--bone);font:400 12px var(--body);cursor:pointer}
.item b{font:700 13px var(--pixel);letter-spacing:.03em}
.item .cost{font:700 12px var(--pixel);color:var(--ember)}
.item[disabled]{opacity:.4;cursor:default}
.item:not([disabled]):active{transform:translateY(1px)}
.item:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
.shopgrid .item{flex-direction:row;align-items:center;gap:10px}
.item .ico{font-size:34px;font-style:normal;line-height:1;flex:none;width:44px;text-align:center}
.item .txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.item.off .ico{font-size:26px;width:34px}
#shopGP{color:var(--ember)}
.btn.alt{background:#5d5478;color:var(--bone)}
.rackmodes{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.rackmodes button{font:700 13px var(--pixel);letter-spacing:.05em;color:var(--bone);background:rgba(246,238,223,.08);border:2px solid rgba(246,238,223,.25);padding:8px 14px;cursor:pointer}
.rackmodes button[aria-pressed="true"]{border-color:#7dffe8;color:#7dffe8;background:rgba(125,255,232,.12)}
.rackmodes button:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
.shopgrid .item.sel{border-color:#7dffe8;background:rgba(125,255,232,.16);box-shadow:0 0 0 2px rgba(125,255,232,.35)}
.shopgrid .item.now{border-color:var(--ember)}
#rackHint{color:#7dffe8;min-height:1.2em}
@media (max-height:520px){#rackScreen .panel{gap:8px}#rackScreen .title{font-size:24px!important}#rackScreen .shopgrid{max-height:calc(100vh - 205px);max-height:calc(100dvh - 205px)}#rackScreen{padding:8px 16px}}
#clockSvg{width:min(46vh,240px);height:min(46vh,240px);touch-action:none;cursor:grab;max-width:100%}
</style>

</head>
<body>
<div id="app">
  <canvas id="c" aria-label="Stick Duel game area"></canvas>
  <button id="pauseBtn" type="button" aria-label="Pause"><i></i><i></i></button>
  <button id="musicBtn" type="button" aria-label="Music on or off">♪</button>
  <button id="homeBtn" type="button" hidden>◀ ARCHER</button>
  <div id="quiver" hidden></div>

  <div class="overlay" id="startScreen">
    <div class="panel">
      <h1 class="title">STICK<br><em>DUEL</em></h1>
      <p class="small">Pull back to aim · let go to fire</p>
      <button class="btn" id="playBtn" type="button">FIGHT</button>
      <button class="btn alt" id="pracBtn" type="button" style="font-size:15px">🎯 PRACTICE RANGE</button>
      <p class="small" id="bestLine">Turn your phone sideways to play</p>
    </div>
  </div>

  <div class="overlay" id="rotateScreen" hidden>
    <div class="panel">
      <h2 class="title" style="font-size:34px">TURN YOUR<br><em>PHONE</em></h2>
      <p class="small">Stick Duel plays sideways</p>
      <button class="btn" id="portraitBtn" type="button" style="background:#5d5478;color:var(--bone);font-size:14px">PLAY UPRIGHT ANYWAY</button>
    </div>
  </div>

  <div class="overlay" id="clockScreen" hidden>
    <div class="panel" style="gap:10px">
      <h2 class="title" style="font-size:clamp(24px,5vw,34px)">TIME</h2>
      <p class="small">Drag the hand · left slows this round, right speeds it up</p>
      <svg id="clockSvg" viewBox="-120 -120 240 240" aria-label="Time dial">
        <circle r="112" fill="#3a2a1c"/><circle r="104" fill="#f6eedf"/>
        <path id="arcSlow" fill="none" stroke="#7ad7ff" stroke-width="12"/>
        <path id="arcFast" fill="none" stroke="#ff8a5a" stroke-width="12"/>
        <g id="clockTicks"></g>
        <text x="-62" y="62" text-anchor="middle" font-family="Silkscreen,monospace" font-size="13" fill="#2a6a8a">SLOW</text>
        <text x="62" y="62" text-anchor="middle" font-family="Silkscreen,monospace" font-size="13" fill="#a8401c">FAST</text>
        <line id="clockHand" x1="0" y1="10" x2="0" y2="-86" stroke="#141414" stroke-width="7" stroke-linecap="round"/>
        <circle r="9" fill="#141414"/><circle r="4" fill="#ffd27a"/>
      </svg>
      <p class="newbest" id="clockLbl" style="color:var(--ember);font-size:22px">×1</p>
      <button class="btn" id="clockGo" type="button">SET TIME</button>
    </div>
  </div>

  <div class="overlay" id="shopScreen" hidden>
    <div class="panel" style="width:min(760px,100%)">
      <h2 class="title" style="font-size:clamp(28px,6vw,40px)">ARMOURY</h2>
      <p class="newbest" id="shopGP">GP 0</p>
      <div class="shopgrid" id="shopGrid"></div>
      <button class="btn" id="shopNext" type="button">NEXT LEVEL ▶</button>
    </div>
  </div>

  <div class="overlay" id="rackScreen" hidden>
    <div class="panel" style="width:min(760px,100%);gap:10px">
      <h2 class="title" style="font-size:clamp(26px,6vw,38px)">ARROW RACK</h2>
      <div class="rackmodes" role="group" aria-label="Arrow mode">
        <button type="button" id="rackOne" aria-pressed="true">ONE ARROW</button>
        <button type="button" id="rackTwo" aria-pressed="false">🔗 LINK TWO</button>
        <button type="button" id="rackBoss" aria-pressed="false">👑 BOSSES</button>
      </div>
      <p class="small" id="rackHint">Tap an arrow to load it</p>
      <div class="shopgrid" id="rackGrid"></div>
      <button class="btn" id="rackBack" type="button" style="font-size:16px;padding:10px 26px">BACK</button>
    </div>
  </div>

  <div class="overlay" id="pauseScreen" hidden>
    <div class="panel">
      <h2 class="title" style="font-size:44px">PAUSED</h2>
      <button class="btn" id="resumeBtn" type="button">RESUME</button>
      <button class="btn" id="restartBtn" type="button" style="background:#5d5478;color:var(--bone)">RESTART</button>
      <button class="btn alt" id="menuBtn" type="button" style="font-size:15px">MAIN MENU</button>
    </div>
  </div>

  <div class="overlay" id="overScreen" hidden>
    <div class="panel">
      <h2 class="title" id="overTitle" style="font-size:clamp(38px,11vw,54px)">YOU <em>FELL</em></h2>
      <p class="newbest" id="newBest" hidden>NEW BEST</p>
      <div class="stats">
        <div class="stat"><span>Kills</span><b id="oKills">0</b></div>
        <div class="stat"><span>Headshots</span><b id="oHeads">0</b></div>
        <div class="stat"><span>Best</span><b id="oBest">0</b></div>
      </div>
      <button class="btn" id="againBtn" type="button">FIGHT AGAIN</button>
    </div>
  </div>
</div>

<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) * 1.15;
const G = 700;
const NAMES = ['Twig', 'Flint', 'Quill', 'Sparrow', 'Thorn', 'Hawk', 'Ash', 'Raven', 'Viper', 'Ghost', 'Reaper', 'Wren', 'Cinder', 'Shade'];
const PAD = 11, PAD_GAP = 6;
const barrierX = () => st.P.x + 72, barrierTop = () => -st.P.h - 175, barrierBot = () => -st.P.h + 12;
const POWERS = {
  triple: { name: 'TRIPLE SHOT', short: 'TRIPLE', col: '#9fe8ff', shots: 6 },
  fire:   { name: 'FLAMING ARROWS', short: 'FIRE', col: '#ff9a45', shots: 6 },
  ice:    { name: 'ICE ARROWS',  short: 'ICE',    col: '#bfe9ff', shots: 6 },
  boom:   { name: 'EXPLOSIVE',   short: 'BOOM',   col: '#ff5a4e', shots: 5 },
  heavy:  { name: 'HEAVY BOW',   short: 'HEAVY',  col: '#ffd27a', shots: 6 },
  rapid:  { name: 'RAPID DRAW',  short: 'RAPID',  col: '#7dff9a', shots: 10 },
  pierce: { name: 'PIERCING',    short: 'PIERCE', col: '#e0e0ff', shots: 6 },
  homing: { name: 'HOMING',      short: 'HOMING', col: '#ff8ad8', shots: 4 },
  storm:  { name: 'CHAIN LIGHTNING', short: 'ZAP', col: '#fff36b', shots: 5 },
  cluster:{ name: 'CLUSTER',     short: 'CLUSTER', col: '#ffb3f0', shots: 4 },
  scope:  { name: 'SCOPE',       short: 'SCOPE',  col: '#a8ffef', shots: 6 },
  shield: { name: 'BARRIER',     short: 'BARRIER', col: '#8fc8ff', shots: 0, rare: true },
  slowmo: { name: 'SLOW-MO',     short: 'SLOW',   col: '#7ad7ff', shots: 3, rare: true },
  tornado:{ name: 'TORNADO',     short: 'TWISTER', col: '#d6e4f0', shots: 3 },
  shrink: { name: 'SHRINK ARROWS', short: 'SHRINK', col: '#b6ff5c', shots: 6 },
  tele:   { name: 'TELEPORT ARROWS', short: 'TELEPORT', col: '#d58cff', shots: 4 },
  meteor: { name: 'METEOR SHOWER', short: 'METEOR', col: '#ff7b3a', shots: 1, mega: true },
  blackhole:{ name: 'BLACK HOLE', short: 'VOID',   col: '#b07cff', shots: 1, ultra: true }
};
// linked arrows carry two powers (pk + pk2); these helpers treat both the same
const hasPk = (ar, k) => !!ar && (ar.pk === k || ar.pk2 === k);
const pkMul = k => k === 'fire' ? 1.2 : k === 'heavy' ? 1.35 : k === 'slowmo' ? .3 : 1;
// damage of a (linked) arrow: slow-mo's low damage only counts when it is on its own
const slowFree = k => k === 'slowmo' ? 1 : pkMul(k);
const dmgOf = (k, k2) => k2 ? slowFree(k) * slowFree(k2) : pkMul(k);
// big area powers (twister, black hole, chain lightning) go off once per SHOT, however many arrows
// the shot turns into (triple, cluster split, windows, piercing). Meteor rocks are shared out instead.
const shotOf = ar => { const R = ar.root || ar; return R.vol || R; };
const shotOnce = (ar, k) => { const S = shotOf(ar); S.once = S.once || {}; if (S.once[k]) return false; S.once[k] = true; return true; };
// linked arrows: the second power rides on whatever the first one makes
// (ice + meteor = ice chunks that freeze, fire + twister = fire twister, ice + boom = a blast that freezes everyone near it)
const riderOf = (ar, k) => !ar ? null : ar.pk === k ? (ar.pk2 || ar.rider || null) : ar.pk2 === k ? ar.pk : null;
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)).join(',');
const RIDE = {   // [glow rgb, main colour, light colour, particle kind]
  fire: ['255,140,60', '#ff9a45', '#ffd27a', 'flame'], ice: ['170,225,255', '#9fd8ff', '#ffffff', 'shard'],
  boom: ['255,110,80', '#ff5a4e', '#ffd27a', 'flame'], heavy: ['255,210,122', '#ffd27a', '#fff2c8', 'spark'],
  storm: ['255,243,107', '#fff36b', '#ffffff', 'spark'], slowmo: ['122,215,255', '#7ad7ff', '#e0f6ff', 'spark'],
  shrink: ['182,255,92', '#b6ff5c', '#eaffd0', 'spark'], tele: ['213,140,255', '#d58cff', '#f2ddff', 'spark'],
  homing: ['255,138,216', '#ff8ad8', '#ffd0f0', 'spark'], blackhole: ['176,124,255', '#b07cff', '#ffffff', 'spark'],
  tornado: ['214,228,240', '#d6e4f0', '#ffffff', 'spark'], meteor: ['255,123,58', '#ff7b3a', '#ffd27a', 'flame']
};
const rideOf = k => RIDE[k] || [hexRgb(POWERS[k].col), POWERS[k].col, '#ffffff', 'spark'];
const RIDE_NAME = { fire: 'FIRE', ice: 'ICE', boom: 'BOMB', heavy: 'GIANT', storm: 'THUNDER', slowmo: 'SLOW', shrink: 'SHRINK', tele: 'WARP', homing: 'HUNTER',
  blackhole: 'VOID', tornado: 'WINDY', meteor: 'BURNING', triple: 'TRIPLE', rapid: 'QUICK', pierce: 'SHARP', scope: 'SCOPED', cluster: 'CONFETTI' };
const RIDE_ON = { fire: 1, ice: 1, slowmo: 1, shrink: 1, boom: 1, storm: 1, heavy: 1 };   // a twister hands these to the arrows it turns round
const powShort = q => q.k2 ? POWERS[q.k].short + '+' + POWERS[q.k2].short : POWERS[q.k].short;
const powName = q => q.k2 ? powShort(q) : POWERS[q.k].name;
// a picture for every shop item and arrow type (shop cards and the quiver buttons)
const ICON = {
  hp: '❤️', dmg: '🗡️', barrier: '🧱', reload: '⏱️', quiver: '🏹', crates: '📦', medkits: '🩹', aim: '📏',
  armour: '🛡️', leech: '🧛', revive: '💨', glass: '🪟', helper: '🤝',
  pw_triple: '🔱', pw_fire: '🔥', pw_ice: '❄️', pw_boom: '💥', pw_heavy: '🪨', pw_rapid: '⏩', pw_pierce: '📌',
  pw_homing: '🎯', pw_storm: '⚡', pw_cluster: '🎆', pw_scope: '🔭', pw_slowmo: '🐢', pw_tornado: '🌪️',
  pw_shrink: '🤏', pw_tele: '🌀', pw_blackhole: '🕳️', pw_meteor: '☄️', pw_shield: '🧱'
};

let W = 0, H = 0, DPR = 1, sc = 1, camX = 0, camY = 0, scBase = 1, zoom = 1, forcePortrait = false;
try { const z = +localStorage.getItem('stickZoom'); if (z >= .5 && z <= 1.8) zoom = z; } catch (e) {}
let st = null, running = false, paused = false, last = 0, best = 0, uid = 0;
try { best = +localStorage.getItem('stickDuelBest') || 0; } catch (e) {}

const GROUND = 30;
const SX = x => (x - camX) * sc, SY = y => H - GROUND + camY + y * sc;
const homeCam = () => st.P.x - (W / sc) * .2 - (st.helpers ? st.helpers.length * 45 : 0);
const show = (id, on) => { $(id).hidden = !on; };

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const r = cv.getBoundingClientRect();
  W = r.width; H = r.height;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  scBase = Math.min((H - GROUND) / 345, W / 470); sc = scBase * zoom;
  if (st) camX = homeCam();
}

const SPECKS = [];
for (let i = 0; i < 90; i++) SPECKS.push({ x: Math.random(), y: Math.random(), r: rand(.8, 2), v: rand(4, 14) });

function mkArcher(x, h, f, hp, isP, pw) {
  return { id: ++uid, x, h, f, hp, max: hp, pw, aim: f > 0 ? -.35 : Math.PI + .35, pow: 0, stuck: [], dead: false,
    rot: 0, vr: 0, dy: 0, vy: 0, vx: 0, dx: 0, headRed: 0, hitT: 0, isP, rise: 0,
    aiT: 0, aiAim: null, aiShots: 0 };
}
const feet = a => ({ x: a.x + a.dx, y: -a.h + a.dy });
const sizeOf = a => (a.big || 1) * (1 - (a.shrink || 0));
const shoulder = a => { const f = feet(a); return { x: f.x, y: f.y - 64 * sizeOf(a) }; };
const alive = () => st.enemies.filter(e => !e.dead);
const farX = () => Math.max(...st.enemies.map(e => e.x));

function newGame() {
  st = { helpers: [], reloadMul: 1, extraShots: 0, extraCrates: 0, extraHp: 0, longAim: false, armour: 0, leech: 0, revive: 0, winBonus: 0, dmgBoost: 1, shopBuys: {}, shop: false, level: 1, kills: 0, heads: 0, gp: 0, arrows: [], parts: [], texts: [], pinned: [], enemies: [], gadgets: [],
    wind: 0, camHold: 0, camLast: 0, camFocus: null, lastShot: null, slow: 0, shake: 0, hint: true,

  for (let i = 0; i < 7; i++) {
    const sx = b.x + (-60 + i * 21) * -m, top = b.y - b.ry * Math.sqrt(Math.max(0, 1 - ((sx - b.x) / b.rx) ** 2)), hgt = 14 + (i % 2) * 6;
    ctx.fillStyle = bone; ctx.strokeStyle = dark; ctx.lineWidth = 1.5 * sc;
    ctx.beginPath(); ctx.moveTo(X(sx - 7), Y(top + 5)); ctx.lineTo(X(sx + 3 * m), Y(top - hgt)); ctx.lineTo(X(sx + 7), Y(top + 5)); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  // the heart, showing through a gap in its armour (the only weak spot)
  const H = hydraHeart(E), pr = (11 + 2 * Math.sin(t * 6)) * sc, hx0 = X(H.x), hy0 = Y(H.y);
  ctx.fillStyle = '#2a0c10'; ctx.strokeStyle = bone; ctx.lineWidth = 2 * sc;
  ctx.beginPath(); ctx.ellipse(hx0, hy0 + 1 * sc, 19 * sc, 17 * sc, 0, 0, 6.283); ctx.fill(); ctx.stroke();
  if (!E.dead) {
    ctx.save();
    const hg = ctx.createRadialGradient(hx0, hy0, 2, hx0, hy0, 30 * sc);
    hg.addColorStop(0, 'rgba(255,80,90,.55)'); hg.addColorStop(1, 'rgba(255,80,90,0)');
    ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(hx0, hy0, 30 * sc, 0, 6.283); ctx.fill();
    ctx.shadowColor = '#ff3a4a'; ctx.shadowBlur = 16; ctx.fillStyle = '#ff3a4a';
    ctx.beginPath(); ctx.arc(hx0 - pr * .45, hy0 - pr * .2, pr * .6, 0, 6.283); ctx.arc(hx0 + pr * .45, hy0 - pr * .2, pr * .6, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.moveTo(hx0 - pr * 1.02, hy0 - pr * .05); ctx.lineTo(hx0, hy0 + pr * 1.05); ctx.lineTo(hx0 + pr * 1.02, hy0 - pr * .05); ctx.fill();
    ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(255,220,220,.7)'; ctx.beginPath(); ctx.arc(hx0 - pr * .5, hy0 - pr * .35, pr * .2, 0, 6.283); ctx.fill();
    ctx.restore();
  }
  // necks: outline, skin, a pale throat stripe and little spines
  const geo = E.heads.map(h => headGeom(E, h));
  for (const pass of [0, 1, 2]) for (const g of geo) {
    ctx.strokeStyle = pass === 0 ? dark : pass === 1 ? skin : belly; ctx.lineWidth = (pass === 0 ? 22 : pass === 1 ? 16 : 5) * sc;
    const oy = pass === 2 ? 4 : 0;
    ctx.beginPath(); ctx.moveTo(X(g.R.x), Y(g.R.y + oy)); ctx.quadraticCurveTo(X(g.cx), Y(g.cy + oy), X(g.hx), Y(g.hy + oy)); ctx.stroke();
  }
  ctx.fillStyle = bone;
  for (const g of geo) for (let s = 1; s < 6; s++) {
    const u = s / 6, q = 1 - u, nx = q * q * g.R.x + 2 * q * u * g.cx + u * u * g.hx, ny = q * q * g.R.y + 2 * q * u * g.cy + u * u * g.hy;
    ctx.beginPath(); ctx.moveTo(X(nx - 3), Y(ny - 7)); ctx.lineTo(X(nx + 2 * m), Y(ny - 14)); ctx.lineTo(X(nx + 4), Y(ny - 6)); ctx.fill();
  }
  // heads (or bleeding stumps with a countdown)
  E.heads.forEach((h, i) => {
    const g = geo[i], hx = X(g.hx), hy = Y(g.hy);
    if (h.t > 0) {
      ctx.fillStyle = '#a8322c'; ctx.strokeStyle = bone; ctx.lineWidth = 2 * sc;
      ctx.beginPath(); ctx.arc(hx, hy, 9 * sc, 0, 6.283); ctx.fill(); ctx.stroke();
      if (Math.random() < .3) P_(g.hx, g.hy, rand(-20, 20), rand(-10, 40), .4, 2, '#c4141c');
      ctx.font = '700 ' + Math.round(22 * Math.min(1.4, sc + .3)) + 'px Silkscreen, monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillStyle = Math.sin(t * 12) > 0 ? '#ffd27a' : '#ff5a4e'; ctx.fillText(String(Math.ceil(h.t)), hx, hy - 12 * sc);
      return;
    }
    const s = sc * (.4 + .6 * h.g), ang = Math.atan2(g.hy - g.cy, (g.hx - g.cx) * -m), col = HYDRA_EL[h.el];
    const jaw = E.dead ? .35 : h.br > 0 ? .55 : .1 + .07 * Math.sin(t * 2.2 + h.ph);
    ctx.save(); ctx.translate(hx, hy); ctx.scale(m > 0 ? -s : s, s); ctx.rotate(ang * .35);
    // frill behind the jaw
    ctx.fillStyle = '#2b5534'; ctx.strokeStyle = dark; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-10, -6); ctx.lineTo(-26, -14); ctx.lineTo(-18, -2); ctx.lineTo(-28, 4); ctx.lineTo(-14, 6); ctx.lineTo(-22, 14); ctx.lineTo(-6, 9); ctx.closePath(); ctx.fill(); ctx.stroke();
    // lower jaw (opens) with teeth, and a glowing mouth when it breathes
    ctx.save(); ctx.translate(-6, 4); ctx.rotate(jaw);
    if (jaw > .2 && !E.dead) { ctx.fillStyle = h.br > 0 ? col : '#5a1418'; ctx.globalAlpha = h.br > 0 ? .85 : 1; ctx.beginPath(); ctx.moveTo(0, -2); ctx.lineTo(34, -6); ctx.lineTo(30, 4); ctx.lineTo(0, 6); ctx.fill(); ctx.globalAlpha = 1; }
    ctx.fillStyle = skin; ctx.strokeStyle = dark; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-4, 0); ctx.lineTo(30, 0); ctx.quadraticCurveTo(34, 4, 28, 7); ctx.lineTo(-2, 9); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff6e0';
    for (let k = 6; k <= 26; k += 5) { ctx.beginPath(); ctx.moveTo(k, 0); ctx.lineTo(k + 1.5, -4); ctx.lineTo(k + 3, 0); ctx.fill(); }
    ctx.restore();
    // skull and snout
    const hg = ctx.createLinearGradient(0, -18, 0, 6);
    hg.addColorStop(0, skinHi); hg.addColorStop(1, skin);
    ctx.fillStyle = hg; ctx.strokeStyle = dark; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(-16, -6); ctx.quadraticCurveTo(-10, -19, 6, -15); ctx.lineTo(28, -9); ctx.quadraticCurveTo(39, -7, 39, -1); ctx.lineTo(24, 4); ctx.lineTo(-8, 7); ctx.quadraticCurveTo(-17, 4, -16, -6); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff6e0';
    for (let k = 4; k <= 24; k += 5) { ctx.beginPath(); ctx.moveTo(k, 4.5 - k * .03); ctx.lineTo(k + 1.5, 9); ctx.lineTo(k + 3, 4.3 - k * .03); ctx.fill(); }
    ctx.fillStyle = dark; ctx.beginPath(); ctx.ellipse(33, -5, 2, 1.3, -.3, 0, 6.283); ctx.fill();   // nostril
    ctx.strokeStyle = dark; ctx.lineWidth = 2.6; ctx.beginPath(); ctx.moveTo(-2, -13); ctx.quadraticCurveTo(6, -16, 13, -11); ctx.stroke();   // brow
    // horns in the head's colour (shows what it shoots)
    ctx.fillStyle = col; ctx.strokeStyle = dark; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(-8, -13); ctx.quadraticCurveTo(-20, -22, -34, -20); ctx.quadraticCurveTo(-20, -15, -12, -8); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-2, -15); ctx.quadraticCurveTo(-10, -30, -24, -33); ctx.quadraticCurveTo(-12, -24, -6, -11); ctx.closePath(); ctx.fill(); ctx.stroke();
    // eye
    if (E.dead) { ctx.strokeStyle = '#141414'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(5, -11); ctx.lineTo(11, -5); ctx.moveTo(11, -11); ctx.lineTo(5, -5); ctx.stroke(); }
    else {
      ctx.shadowColor = col; ctx.shadowBlur = 10; ctx.fillStyle = col;
      ctx.beginPath(); ctx.ellipse(8, -8, 4.6, 2.8, -.15, 0, 6.283); ctx.fill(); ctx.shadowBlur = 0;
      ctx.fillStyle = '#141414'; ctx.beginPath(); ctx.ellipse(8.6, -8, .9, 2.4, 0, 0, 6.283); ctx.fill();
    }
    if (h.br > 0 && !E.dead) {   // charging its shot: glow at the mouth
      ctx.globalAlpha = .55 + .45 * Math.sin(t * 30); ctx.shadowColor = col; ctx.shadowBlur = 22; ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(40, 4, 5 + (.7 - h.br) * 9, 0, 6.283); ctx.fill(); ctx.globalAlpha = 1; ctx.shadowBlur = 0;
    }
    ctx.restore();
  });
  ctx.restore();
}

// big boss health bar across the top of the screen

  const bw = Math.min(280, W * .34), bx = W / 2 - bw / 2, fr = clamp(B.hp / B.max, 0, 1);

/* ---------- update ---------- */
function update(rdt) {
  const dt = rdt * (st.slow > 0 ? .3 : 1) * (st.timeScale || 1);
  st.slow -= rdt; st.t += dt;
  st.shake *= Math.pow(.02, rdt);
  st.reload -= dt;
  const P = st.P, n = st.enemies.length;

  for (const E of st.enemies) {
    if (E.rise > 0) { E.dy *= Math.pow(.004, dt); if (E.dy < 1) { E.dy = 0; E.rise = 0; } }
    if (!E.dead && E.burn > 0) {
      E.burn -= dt; E.hp -= 7 * dt;
      if (Math.random() < .5) { const f = feet(E); P_(f.x + rand(-8, 8), f.y - rand(30, 90), rand(-20, 20), rand(-90, -30), .45, rand(2.4, 4), Math.random() < .5 ? '#ff9a45' : '#ffd27a', 'flame'); }
      if (E.hp <= 0) kill(E, { vx: -1 }, 'body');
    }
    if (E.ship && !E.dead) shipStep(E, dt);
    if (E.topple) updateTopple(E, dt);
    if (E.shrink > 0) {
      if ((E.shrinkT -= dt) <= 0) {
        E.shrink = Math.max(0, E.shrink - dt * .05);
        if (E.shrink <= 0 && !E.dead) text(feet(E).x, feet(E).y - 130, 'FULL SIZE', '#b6ff5c', 12, .8);
      }
    }
    if (E.slowT > 0) { E.slowT -= dt; if (E.slowT <= 0) { E.slowM = 1; if (!E.dead) text(feet(E).x, feet(E).y - 130, 'SPEED BACK', '#7ad7ff', 12, .8); } }
    if (E.frozen > 0) { E.frozen -= dt; continue; }
    if (E.stun > 0) { E.stun -= dt; continue; }
    if (E.dead || P.dead || E.rise > 0 || st.nextT > 0) continue;
    if (E.dummy && !st.dummyFire) continue;
    const edt = dt * (E.slowT > 0 ? E.slowM : 1);
    if (E.boss && bossStep(E, edt)) continue;
    if (E.kind === 'healer' && !E.aiAim && E.aiT - edt <= 0) {
      const hurt = st.enemies.filter(o => o !== E && !o.dead && !o.hydra && o.hp < o.max);
      if (hurt.length && Math.random() < .7) {
        const f = feet(E);
        for (const o of hurt) {
          o.hp = Math.min(o.max, o.hp + 16); const of = feet(o);
          st.bolts.push({ x1: f.x, y1: f.y - 100, x2: of.x, y2: of.y - 60, life: .5, col: '#7dff9a' });
          text(of.x, of.y - 104, '+16', '#7dff9a', 14, .9);
        }
        ring(f.x, f.y - 100, 40, '#7dff9a', .5, 3); sfx('heal');
        E.aiT = rand(4, 5.5); continue;
      }
    }
    if (E.aiAim) {
      const A = E.aiAim; A.t += edt;
      const k = clamp(A.t / A.dur, 0, 1);
      E.aim = A.from + (A.ang - A.from) * Math.min(1, k * 1.6); E.pow = k;
      if (k >= 1) {
        const n0 = st.arrows.length;
        fire(E, A.ang, A.v, E.kind === 'mage' ? 'fire' : null); E.aiShots++; E.pow = 0; E.aiAim = null;
        if (E.kind === 'mage') for (let q = n0; q < st.arrows.length; q++) { st.arrows[q].magic = true; st.arrows[q].dmgMul = 1.3; }
        if (E.slowT > 0) for (let q = n0; q < st.arrows.length; q++) st.arrows[q].tm = E.slowM;
        E.aiT = Math.max(1.6, 3.8 - st.level * .12) * (.75 + n * .3) * rand(.8, 1.2) * (E.kind === 'crossbow' ? 1.25 : E.kind === 'healer' ? 1.4 : 1) * (E.rage ? .65 : 1);
      }
    } else {
      E.aiT -= edt;
      if (E.aiT <= 0) {
        const pf = feet(P), headP = Math.min(.45, .1 + st.level * .025);
        const ty = Math.random() < headP ? pf.y - 84 : pf.y - 58;
        const sol = solve(E, pf.x, ty, E.kind === 'crossbow');
        const search = 1 + 2.2 * Math.pow(.55, E.aiShots);
        const se = Math.max(.6, 4.6 - st.level * .28) * search, sv = Math.max(8, 50 - st.level * 3) * search;
        const e = (sol.e + gauss() * se) * Math.PI / 180, v = sol.v + gauss() * sv;
        E.aiAim = { ang: Math.PI + e, v, t: 0, dur: Math.max(.45, .9 - st.level * .03) * (E.kind === 'crossbow' ? .6 : 1), from: E.aim };
      }
    }
  }

  for (const Hh of st.helpers) {
    if (Hh.dead || P.dead || st.nextT > 0) continue;
    if (Hh.aiAim) {
      const A = Hh.aiAim; A.t += dt;
      const k = clamp(A.t / A.dur, 0, 1);
      Hh.aim = A.from + (A.ang - A.from) * Math.min(1, k * 1.6); Hh.pow = k;
      if (k >= 1) {
        const n0 = st.arrows.length;
        fire(Hh, A.ang, A.v, Hh.kind === 'mage' ? 'fire' : null);
        for (let q = n0; q < st.arrows.length; q++) { if (Hh.kind === 'mage') st.arrows[q].magic = true; st.arrows[q].dmgMul = .8; }
        Hh.pow = 0; Hh.aiAim = null; Hh.aiT = rand(2.8, 3.8) * (Hh.kind === 'crossbow' ? 1.2 : 1);
      }
    } else if ((Hh.aiT -= dt) <= 0) {
      const tgts = st.enemies.filter(e => !e.dead && e.rise <= 0);
      if (!tgts.length) { Hh.aiT = 1; continue; }
      const T = tgts[Math.floor(Math.random() * tgts.length)], tf = feet(T);
      const sol = solve(Hh, tf.x, tf.y - 60, Hh.kind === 'crossbow');
      const e = (sol.e + gauss() * 2.6) * Math.PI / 180, v = sol.v + gauss() * 24;
      Hh.aiAim = { ang: -e, v, t: 0, dur: .7, from: Hh.aim };
    }
  }
  updateVortices(dt);
  updateMeteors(dt);
  updateBoulders(dt);
  updateWeather(dt);
  if (st.nextT <= 0 && !P.dead) {
    if (SOLDIERS) updateAllies(dt);
    updateMarchers(dt);
    if (st.practice) practiceStep(rdt);
    else if (st.enemies.every(e => e.dead) && !st.marchQ.length && st.marchers.every(m => m.dead)) clearLevel();
  }
  // gadgets ease towards their targets
  for (const g of st.gadgets) {
    const k = Math.min(1, rdt * 6);
    g.x += (g.tx - g.x) * k; g.y += (g.ty - g.y) * k;
    if (g.type === 'fan') { g.ang += (g.tang - g.ang) * k; g.spin += dt * 18; }
    if (g.type === 'portal') {
      g.spin += dt * 3;
      if (g.popT > 0) g.popT -= rdt;
      if (st.nextT <= 0 && (g.jumpT -= dt) <= 0) portalJump(g);
    }
    if (g.flash > 0) g.flash -= rdt;
    if ((g.type === 'fan' || g.type === 'win' || g.type === 'bounce' || g.type === 'magnet') && !g.falling) {
      if (g.type === 'bounce') g.ang += (g.tang - g.ang) * k;
      if (g.hold > 0) g.hold -= dt;
      else if (st.nextT <= 0) { g.relocT -= dt; if (g.relocT <= 0) relocate(g); }
    }
  }
  updateDirector(dt);
  st.gadgets = st.gadgets.filter(g => !g.gone);

  // arrows
  headshotSlowmo();
  for (const ar of st.arrows) {
    if (ar.done) continue;
    const steps = 4, sdt = dt * (ar.tm || 1) / steps;
    if (ar.tm && Math.random() < .25) P_(ar.x, ar.y, 0, 0, .5, 2, '#7ad7ff', 'spark');
    for (let i = 0; i < steps && !ar.done; i++) {
      if (ar.ret) { returnStep(ar, sdt); continue; }
      ar.vx += st.wind * sdt; ar.vy += G * sdt; ar.x += ar.vx * sdt; ar.y += ar.vy * sdt;
      if (ar.portT > 0) ar.portT -= sdt;
      if (ar.bounceT > 0) ar.bounceT -= sdt;
      if (hasPk(ar, 'homing') && ar.owner === P) {
        let tg = null, bd = 520;
        for (const E of st.enemies) { if (E.dead) continue; const f = feet(E), d = Math.hypot(f.x - ar.x, f.y - 60 - ar.y); if (d < bd && f.x > ar.x - 40) { bd = d; tg = f; } }
        if (tg) {
          const cur = Math.atan2(ar.vy, ar.vx), want = Math.atan2(tg.y - 60 - ar.y, tg.x - ar.x), sp = Math.hypot(ar.vx, ar.vy);
          let dA = ((want - cur + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
          const na = cur + clamp(dA, -3 * sdt, 3 * sdt);
          ar.vx = Math.cos(na) * sp; ar.vy = Math.sin(na) * sp;
          if (Math.random() < .2) st.parts.push({ x: ar.x, y: ar.y, vx: 0, vy: 0, life: .3, max: .3, r: 2, col: '#ff8ad8' });
        }
      }
      if (hasPk(ar, 'cluster') && !ar.split && !ar.owner.isP && ar.vy > 0) splitCluster(ar);
      gadgetStep(ar, sdt);
      if (ar.done) break;
      if (ar.owner.isP) {
        if (coverHit(ar)) break;
        if (boulderHit(ar)) break;
        for (const E of st.enemies) {
          if (E.ship && !E.ship.down && !E.dead && !ar.done) {
            const f = feet(E), bx = (ar.x - f.x) / 70, by = (ar.y - (f.y - 140)) / (38 * balloonSquash(E));
            if (bx * bx + by * by < 1) {
              ar.done = true;
              hitBalloon(E, ar); impactFX(ar, ar.x, ar.y, true); sfx('hit');
              for (let q = 0; q < 8; q++) P_(ar.x, ar.y, rand(-120, 120), rand(-120, 40), .4, 2.2, '#d4322c', 'spark');
              if (E.hp <= 0) kill(E, ar, 'body');
              break;
            }
          }
        }
        if (ar.done) break;
        for (const E of st.enemies) if (E.hydra && !E.dead && hydraHit(E, ar)) break;
        if (ar.done) break;
        for (const E of st.enemies) { if (ar.hit && ar.hit.has(E)) continue; const z = zone(E, ar.x, ar.y); if (z) { onHit(ar, E, z); break; } }
        if (!ar.done && SOLDIERS) {
          const L = leverPos();
          if (Math.hypot(ar.x - L.x, ar.y - L.y) < 17) {
            ar.done = true;
            st.pinned.push({ x: ar.x, y: ar.y, ang: Math.atan2(ar.vy, ar.vx), col: ar.col });
            if (st.gateCD <= 0) releaseAllies(); else { text(L.x, L.y - 30, 'NOT READY', '#f6eedf', 12, .8); sfx('thud'); }
          }
        }
        if (!ar.done && ar.y > -260) for (const m of st.marchers) { if (ar.mhit && ar.mhit.has(m)) continue; const z = mZone(m, ar.x, ar.y); if (z) { onMarcherHit(ar, m, z); break; } }
      } else {
        const B = st.barrier, bx = barrierX();
        if (B && Math.abs(ar.x - bx) < 7 && ar.y > barrierTop() && ar.y < barrierBot()) {
          const dmg = hasPk(ar, 'boom') ? 40 : 20;
          B.hp -= dmg; B.hitT = .15; ar.done = true;
          text(bx, ar.y - 14, '-' + dmg, '#8fc8ff', 14, .7);
          for (let q = 0; q < 12; q++) st.parts.push({ x: ar.x, y: ar.y, vx: rand(20, 200), vy: rand(-160, 60), life: .4, max: .4, r: 2.2, col: '#8fc8ff' });
          sfx('glass');
          if (B.hp <= 0) {
            st.barrier = null; text(bx, barrierTop() - 10, 'BARRIER DOWN', '#ff5a4e', 16, 1.2);
            for (let q = 0; q < 40; q++) st.parts.push({ x: bx, y: rand(barrierTop(), barrierBot()), vx: rand(-160, 160), vy: rand(-200, 40), life: .7, max: .7, r: 2.6, col: '#bfe2ff' });
            shake(6);
          }
        } else {
          const z = zone(P, ar.x, ar.y); if (z) onHit(ar, P, z);
          else for (const Hh of st.helpers) { if (Hh.dead) continue; const z2 = zone(Hh, ar.x, ar.y); if (z2) { onHit(ar, Hh, z2); break; } }
        }
      }
      if (ar.done) break;
      for (const a of [P, ...st.helpers, ...st.enemies]) {
        if (!a.dead && inPillar(a, ar.x, ar.y)) {
          ar.done = true;
          if (!a.ship) st.pinned.push({ x: ar.x, y: ar.y, ang: Math.atan2(ar.vy, ar.vx), col: ar.col });
          for (let q = 0; q < 6; q++) st.parts.push({ x: ar.x, y: ar.y, vx: rand(-80, 80), vy: rand(-120, -20), life: .35, max: .35, r: 2, col: '#e8d3ac' });
          impactFX(ar, ar.x, ar.y, false);
          if (hasPk(ar, 'boom')) { if (ar.owner.isP) chopPillar(a, ar); blast(ar.x, ar.y, ar.owner, riderOf(ar, 'boom')); } else sfx('thud');
          break;
        }
      }
      if (!ar.done && ar.y >= 0) {

    o.connect(g); g.connect(this.out); o.start(t); o.stop(t + dur + .05);
  },
  play(step, t) {
    const s8 = step % 8, bar = Math.floor(step / 8) % 4, [root, q] = this.BAR[bar];
    if (s8 === 0) {
      // pad chord
      for (const iv of [12, q === 'm' ? 15 : 16, 19]) this.note('sine', mtof(root + iv), t, 2.6, .028, .5);
      this.note('triangle', mtof(root), t, 1.6, .09, .02);
    }
    if (s8 === 4) this.note('triangle', mtof(root + 7), t, 1, .06, .02);
    // low drum
    if (s8 === 0 || s8 === 5) {
      const o = AC.createOscillator(), g = AC.createGain();
      o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(45, t + .2);
      g.gain.setValueAtTime(.16, t); g.gain.exponentialRampToValueAtTime(.0001, t + .3);
      o.connect(g); g.connect(this.out); o.start(t); o.stop(t + .35);
    }
    // soft shaker
    if (s8 % 2 === 1) {
      const n = AC.createBufferSource(), hp = AC.createBiquadFilter(), g = AC.createGain();
      n.buffer = this.noise; hp.type = 'highpass'; hp.frequency.value = 6000;
      g.gain.setValueAtTime(.025, t); g.gain.exponentialRampToValueAtTime(.0001, t + .06);
      n.connect(hp); hp.connect(g); g.connect(this.out); n.start(t); n.stop(t + .08);
    }
    // plucked melody
    if (Math.random() < (s8 % 2 === 0 ? .62 : .28)) {
      this.mel = clamp(this.mel + Math.round(rand(-2, 2)), 0, this.SCALE.length - 1);
      const f = mtof(this.SCALE[this.mel]);
      this.note('triangle', f, t, .7, .05, .005);
      this.note('sine', f * 2, t, .25, .012, .005);
    }
  }
};
$('musicBtn').onclick = () => {
  Music.on = !Music.on; $('musicBtn').classList.toggle('off', !Music.on);
  if (Music.on && running && !paused) Music.start(); else Music.fade();
};

/* ---------- practice range: straw dummies, any arrow from the rack, unlimited shots ---------- */
const PRAC_X = [650, 1050, 1500, 1950], PRAC_H = [70, 135, 175, 110];
const RACK = ['triple', 'fire', 'ice', 'boom', 'heavy', 'rapid', 'pierce', 'homing', 'storm', 'cluster', 'scope', 'slowmo', 'tornado', 'shrink', 'tele', 'meteor', 'blackhole'];
const RACK_DESC = {
  plain: 'A normal arrow', triple: '3 arrows at once', fire: 'Sets them on fire', ice: 'Freezes them solid', boom: 'Explodes; 3 hits topple a tower',
  heavy: 'Hits much harder', rapid: 'Very fast reload', pierce: 'Goes through archers', homing: 'Steers into the nearest archer',
  storm: 'Lightning jumps between archers', cluster: 'Tap the screen to split it', scope: 'Shows where your arrow will go',
  slowmo: 'Slows down whoever it hits', tornado: 'A twister that turns arrows round', shrink: 'Each hit shrinks them',
  tele: 'Tag one; your next arrow moves them there', meteor: 'Rocks rain down. They hit you too!', blackhole: 'Sucks everything in',
  shield: 'Puts a wall up in front of you'
};
function makeDummy(i) {
  const e = mkArcher(PRAC_X[i], PRAC_H[i], -1, 200, false, 54);
  e.name = '#' + (i + 1); e.kind = 'dummy'; e.dummy = true; e.slot = i; e.chops = [];
  e.aiT = st.dummyFire ? rand(1.5, 3.5) : 1e9;
  return e;
}
function setupPractice() {
  st.practice = true; st.level = 6; st.wind = 0; st.weather = 'clear';
  st.gadgets = []; st.dirT = undefined; st.tornados = []; st.holes = []; st.showers = []; st.rocks = [];
  st.enemies = PRAC_X.map((x, i) => makeDummy(i));
  st.quiver = []; st.power = null; st.links = 0; st.shotDmg = 0; st.bestDmg = 0;
  st.banner = { t: 'PRACTICE RANGE', sub: 'TAP THE ARROW BUTTON TO PICK ANY ARROW', life: 3 };
  camX = homeCam();
}
// fight any boss in the practice range (you can't die here)
const PRAC_BOSS = ['ship', 'giant', 'wizard', 'hydra'], PRAC_BOSS_ICO = { ship: '🎈', giant: '👹', wizard: '🧙', hydra: '🐉' };
const PRAC_BOSS_DESC = { ship: 'Flies about. Pop the balloon 6 times to crash it', giant: 'Walks at you, throws boulders, swings a club. Shoot the boulders!',
  wizard: 'Jumps from tower to tower, throws fireballs', hydra: 'Shoot a head off and two grow back. Only the heart hurts it' };
function practiceBoss(bt) {
  st.pracBoss = bt;
  st.enemies = []; st.boulders = []; st.P.tpTag = null; st.shotDmg = 0;
  for (const ar of st.arrows) if (ar.owner !== st.P) ar.done = true;
  const e = mkArcher({ ship: 1300, giant: 1650, wizard: 1300, hydra: 1450 }[bt], rand(90, 160), -1, Math.round((50 + st.level * 8) * BOSS_INFO[bt].hp), false, 54);
  e.name = 'BOSS'; e.boss = true; e.chops = []; e.kind = 'archer'; e.aiT = 2.5;
  makeBoss(e, bt, (PRAC_BOSS.indexOf(bt) + 1) * 5);
  st.enemies.push(e);
  st.banner = { t: e.name, sub: "PRACTICE · YOU CAN'T DIE HERE", life: 2.4 };
  camX = homeCam();
}
function resetDummies() {
  st.pracBoss = null; st.boulders = [];
  st.enemies = PRAC_X.map((x, i) => makeDummy(i));
  st.P.tpTag = null; st.shotDmg = 0;
  for (const ar of st.arrows) if (ar.owner !== st.P) ar.done = true;
  sfx('click');
}
function practiceStep(rdt) {
  const P = st.P;
  if (P.hp < P.max) P.hp = Math.min(P.max, P.hp + 25 * rdt);
  if (st.pracBoss) {   // beaten boss comes back after a moment; its guards just go away
    st.enemies = st.enemies.filter(e => !(e.guard && e.dead && (e.backT = (e.backT === undefined ? 2 : e.backT) - rdt) <= 0));
    const B = st.enemies.find(e => e.boss);
    if (!B || (B.dead && (B.backT = (B.backT === undefined ? 4 : B.backT) - rdt) <= 0)) { practiceBoss(st.pracBoss); return; }
  }
  st.enemies.forEach((e, i) => {
    // count the damage each shot does (arrows, fire, rocks, blasts all lower hp)
    const hp = Math.max(0, e.hp);
    if (e.lastHp !== undefined && hp < e.lastHp) { st.shotDmg = (st.shotDmg || 0) + e.lastHp - hp; st.bestDmg = Math.max(st.bestDmg || 0, st.shotDmg); }
    e.lastHp = hp;
    if (e.dummy && e.dead && (e.backT = (e.backT === undefined ? 3 : e.backT) - rdt) <= 0) {   // a new dummy pops up
      const d = makeDummy(e.slot); st.enemies[i] = d;
      const f = feet(d); ring(f.x, f.y - 50, 60, '#ffd27a', .5, 3); text(f.x, f.y - 130, 'NEW DUMMY', '#ffd27a', 13, 1);
    }
  });
}
let rackLink = false, rackA = null, rackBoss = false;
function openRack() { if (!st || !st.practice) return; st.rack = true; rackA = null; renderRack(); show('rackScreen', true); sfx('click'); }
function closeRack() { st.rack = false; show('rackScreen', false); quiverSig = ''; }
function rackItem(k, extra) {
  const isPlain = k === 'plain', P = POWERS[k];
  const name = isPlain ? 'PLAIN' : P.name, col = isPlain ? '#f6eedf' : P.col, ico = isPlain ? '➶' : ICON['pw_' + k] || '';
  const now = !rackLink && (isPlain ? !st.power : st.power && st.power.k === k && !st.power.k2);
  return `<button type="button" class="item${rackA === k ? ' sel' : ''}${now ? ' now' : ''}" data-k="${k}"${extra || ''}><i class="ico">${ico}</i><span class="txt"><b style="color:${col}">${name}</b><span>${RACK_DESC[k]}</span></span></button>`;
}
function renderRack() {
  $('rackOne').setAttribute('aria-pressed', String(!rackLink && !rackBoss)); $('rackTwo').setAttribute('aria-pressed', String(rackLink)); $('rackBoss').setAttribute('aria-pressed', String(rackBoss));
  if (rackBoss) {
    $('rackHint').textContent = "Pick a boss to fight. You can't die here.";
    let b = '';
    for (const k of PRAC_BOSS) b += `<button type="button" class="item${st.pracBoss === k ? ' now' : ''}" data-k="boss_${k}"><i class="ico">${PRAC_BOSS_ICO[k]}</i><span class="txt"><b style="color:${BOSS_INFO[k].col}">${BOSS_INFO[k].name}</b><span>${PRAC_BOSS_DESC[k]}</span></span></button>`;
    b += `<button type="button" class="item${st.pracBoss ? '' : ' now'}" data-k="dummies"><i class="ico">🎯</i><span class="txt"><b style="color:#d9b87a">STRAW DUMMIES</b><span>Back to the practice dummies</span></span></button>`;
    $('rackGrid').innerHTML = b; return;
  }
  $('rackHint').textContent = !rackLink ? 'Tap an arrow to load it. Unlimited shots.'
    : rackA ? 'Now tap a second arrow to link with ' + POWERS[rackA].short : 'Tap the first arrow of the pair';
  let h = '';
  if (!rackLink) h += rackItem('plain');
  for (const k of RACK) h += rackItem(k, rackLink && rackA && rackA !== k ? ` aria-label="Link ${POWERS[rackA].short} with ${POWERS[k].short}"` : '');
  if (!rackLink) h += rackItem('shield');
  $('rackGrid').innerHTML = h;
}
function rackPick(k) {
  if (k.startsWith('boss_')) { practiceBoss(k.slice(5)); sfx('click'); closeRack(); return; }
  if (k === 'dummies') { resetDummies(); closeRack(); return; }
  if (!rackLink) {
    if (k === 'plain') st.power = null;
    else if (k === 'shield') { st.barrier = { hp: 120, max: 120, hitT: 0 }; text(feet(st.P).x + 60, feet(st.P).y - 150, 'BARRIER UP', '#8fc8ff', 16, 1.4); }
    else st.power = { k, shots: 99 };
    sfx('click'); closeRack(); return;
  }
  if (!rackA || rackA === k) { rackA = rackA === k ? null : k; sfx('click'); renderRack(); return; }
  let a = rackA, b = k;
  if (b === 'cluster') [a, b] = [b, a];   // cluster first, so its split arrows carry the other power
  st.power = { k: a, k2: b, shots: 99 }; rackA = null;
  const f = feet(st.P);
  text(f.x, f.y - 150, 'LINKED: ' + powShort(st.power), '#7dffe8', 18, 1.8); ring(f.x, f.y - 60, 70, '#7dffe8', .6, 3); sfx('heal');
  closeRack();
}
$('rackOne').onclick = () => { rackLink = false; rackBoss = false; rackA = null; renderRack(); };
$('rackTwo').onclick = () => { rackLink = true; rackBoss = false; rackA = null; renderRack(); };
$('rackBoss').onclick = () => { rackLink = false; rackBoss = true; rackA = null; renderRack(); };
$('rackBack').onclick = closeRack;
$('rackGrid').addEventListener('click', e => { const b = e.target.closest('button[data-k]'); if (b) rackPick(b.dataset.k); });

/* ---------- flow ---------- */
function start(practice) {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.resume) AC.resume().catch(() => {});
  newGame(); running = true; paused = false;
  if (practice === true) setupPractice();
  Music.start();
  show('startScreen', false); show('overScreen', false); show('pauseScreen', false); show('shopScreen', false); show('clockScreen', false); show('rackScreen', false);
}
function gameOver() {
  running = false; Music.fade();
  const isBest = st.kills > best;
  if (isBest) { best = st.kills; try { localStorage.setItem('stickDuelBest', best); } catch (e) {} }
  $('overTitle').innerHTML = st.overReason === 'castle' ? 'CASTLE <em>FELL</em>' : 'YOU <em>FELL</em>';
  $('oKills').textContent = st.kills; $('oHeads').textContent = st.heads; $('oBest').textContent = best;
  $('newBest').hidden = !isBest || st.kills === 0;
  show('overScreen', true);
}
function setPause(p) { if (!running) return; paused = p; show('pauseScreen', p); if (p) Music.fade(); else if (Music.on) Music.start(); }
$('playBtn').onclick = () => start(false); $('againBtn').onclick = () => start(false);
$('pracBtn').onclick = () => start(true);
$('restartBtn').onclick = () => start(!!(st && st.practice));
$('menuBtn').onclick = () => { running = false; paused = false; Music.fade(); show('pauseScreen', false); show('rackScreen', false); show('quiver', false); show('startScreen', true); };
$('resumeBtn').onclick = () => setPause(false);
$('pauseBtn').onclick = () => setPause(!paused);
$('portraitBtn').onclick = () => { forcePortrait = true; show('rotateScreen', false); };
if (best) $('bestLine').textContent = 'Best: ' + best + ' kills · plays sideways';
document.addEventListener('visibilitychange', () => { if (document.hidden) setPause(true); });
addEventListener('keydown', e => { if ((e.key === 'Escape' || e.key === 'p') && running) setPause(!paused); });
addEventListener('resize', resize);

resize(); newGame();
requestAnimationFrame(frame);
})();
</script>
