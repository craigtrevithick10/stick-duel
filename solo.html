<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f2a4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Stick Duel">
<meta name="mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0}[hidden]{display:none!important}</style>
<title>Stick Duel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Rubik:wght@400;600;800&display=swap">
<style>
/* Layout: full-screen canvas duel; minimal grey/white/black look with blood-red accents. Single deliberate theme. */
:root{
  --dusk:#1f2a4a; --ember:#f2a65a; --ink:#141414; --bone:#f6eedf; --blood:#e23b2e; --muted:#b9b0c8;
  --pixel:'Silkscreen','Courier New',monospace;
  --body:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;background:var(--dusk)}
body{height:100%;margin:0;background:var(--dusk);color:var(--bone);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{position:relative;width:100%;height:100%;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
#pauseBtn{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:14px;width:44px;height:44px;border:0;background:none;cursor:pointer;padding:0;display:flex;gap:7px;align-items:center;justify-content:center}
#pauseBtn i{display:block;width:10px;height:30px;background:var(--bone);box-shadow:0 2px 0 rgba(0,0,0,.35)}
#musicBtn{position:absolute;right:calc(max(14px,env(safe-area-inset-right,0px)) + 54px);bottom:14px;width:44px;height:44px;border:0;background:none;cursor:pointer;padding:0;font:700 28px var(--body);color:var(--bone);text-shadow:0 2px 0 rgba(0,0,0,.35)}
#musicBtn.off{opacity:.35;text-decoration:line-through}
#homeBtn{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:14px;padding:10px 16px;border:0;cursor:pointer;font:700 14px var(--pixel);letter-spacing:.06em;color:#24150a;background:var(--ember);box-shadow:0 3px 0 rgba(0,0,0,.35)}
#homeBtn:focus-visible{outline:3px solid var(--blood);outline-offset:3px}
#quiver{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;display:flex;gap:6px}
#quiver button{min-width:62px;padding:6px 8px 5px;border:2px solid rgba(246,238,223,.25);background:rgba(20,14,30,.62);color:var(--bone);font:700 11px var(--pixel);letter-spacing:.04em;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1}
#quiver button small{font:700 11px var(--pixel);color:var(--bone)}
#quiver button.on{border-color:var(--ember);background:rgba(242,166,90,.28);box-shadow:0 0 0 2px rgba(242,166,90,.35)}
#quiver button.empty{opacity:.3;cursor:default}
#quiver{flex-wrap:wrap;justify-content:center}
#quiver .qhint{flex-basis:100%;text-align:center;font:700 11px var(--pixel);color:#7dffe8;letter-spacing:.06em;text-shadow:0 1px 3px #000;margin-bottom:2px}
#quiver button.link{border-color:#7dffe8;color:#7dffe8}
#quiver button.pickme{border-color:#7dffe8;animation:qpulse .8s ease-in-out infinite alternate}
#quiver.linking button[data-i="-1"]{opacity:.3}
@keyframes qpulse{to{box-shadow:0 0 0 3px rgba(125,255,232,.45)}}
#quiver .qi{font-size:20px;font-style:normal;line-height:1}
@media (max-width:700px){#quiver button{min-width:52px;padding:5px 5px 4px;font-size:10px}}
#pauseBtn:focus-visible,#musicBtn:focus-visible,.btn:focus-visible{outline:3px solid var(--blood);outline-offset:3px}
.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:rgba(22,18,38,.78);overflow-y:auto}
.panel{width:min(380px,100%);display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
.title{font-family:var(--pixel);font-weight:700;font-size:clamp(40px,10vw,62px);line-height:.95;margin:0;color:var(--bone);letter-spacing:.02em;text-wrap:balance}
.title em{font-style:normal;color:var(--blood)}
.how{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px;line-height:1.4;color:var(--muted);max-width:36ch}
.how b{color:var(--bone)}
.btn{font-family:var(--pixel);font-weight:700;font-size:20px;letter-spacing:.06em;color:#24150a;background:var(--ember);border:0;padding:14px 34px;cursor:pointer}
.btn:active{transform:translateY(2px)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.stat{background:rgba(246,238,223,.1);padding:10px 8px;display:flex;flex-direction:column;gap:4px}
.stat b{font-family:var(--pixel);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.small{font-size:12px;color:var(--muted);margin:0;letter-spacing:.08em;text-transform:uppercase}
.newbest{font-family:var(--pixel);color:var(--blood);margin:0}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;width:100%;max-height:calc(100vh - 200px);max-height:calc(100dvh - 200px);overflow-y:auto;padding:2px}
.shophead{grid-column:1/-1;margin:6px 0 0;font:700 11px var(--pixel);letter-spacing:.08em;color:rgba(246,238,223,.55);text-align:left}
.item.off{filter:grayscale(1);opacity:.3;padding:7px 10px;font-size:11px;cursor:default}
.item.off b{font-size:12px}
.item.off .cost{color:var(--bone)}
@media (max-height:520px){#shopScreen .panel{gap:8px}#shopScreen .title{font-size:24px!important}}
.item{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;padding:10px 12px;border:1px solid rgba(246,238,223,.18);background:rgba(246,238,223,.08);color:var(--bone);font:400 12px var(--body);cursor:pointer}
.item b{font:700 13px var(--pixel);letter-spacing:.03em}
.item .cost{font:700 12px var(--pixel);color:var(--ember)}
.item[disabled]{opacity:.4;cursor:default}
.item:not([disabled]):active{transform:translateY(1px)}
.item:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
.shopgrid .item{flex-direction:row;align-items:center;gap:10px}
.item .ico{font-size:34px;font-style:normal;line-height:1;flex:none;width:44px;text-align:center}
.item .txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.item.off .ico{font-size:26px;width:34px}
#shopGP{color:var(--ember)}
#clockSvg{width:min(46vh,240px);height:min(46vh,240px);touch-action:none;cursor:grab;max-width:100%}
</style>

</head>
<body>
<div id="app">
  <canvas id="c" aria-label="Stick Duel game area"></canvas>
  <button id="pauseBtn" type="button" aria-label="Pause"><i></i><i></i></button>
  <button id="musicBtn" type="button" aria-label="Music on or off">♪</button>
  <button id="homeBtn" type="button" hidden>◀ ARCHER</button>
  <div id="quiver" hidden></div>

  <div class="overlay" id="startScreen">
    <div class="panel">
      <h1 class="title">STICK<br><em>DUEL</em></h1>
      <p class="small">Pull back to aim · let go to fire</p>
      <button class="btn" id="playBtn" type="button">FIGHT</button>
      <p class="small" id="bestLine">Turn your phone sideways to play</p>
    </div>
  </div>

  <div class="overlay" id="rotateScreen" hidden>
    <div class="panel">
      <h2 class="title" style="font-size:34px">TURN YOUR<br><em>PHONE</em></h2>
      <p class="small">Stick Duel plays sideways</p>
      <button class="btn" id="portraitBtn" type="button" style="background:#5d5478;color:var(--bone);font-size:14px">PLAY UPRIGHT ANYWAY</button>
    </div>
  </div>

  <div class="overlay" id="clockScreen" hidden>
    <div class="panel" style="gap:10px">
      <h2 class="title" style="font-size:clamp(24px,5vw,34px)">TIME</h2>
      <p class="small">Drag the hand · left slows this round, right speeds it up</p>
      <svg id="clockSvg" viewBox="-120 -120 240 240" aria-label="Time dial">
        <circle r="112" fill="#3a2a1c"/><circle r="104" fill="#f6eedf"/>
        <path id="arcSlow" fill="none" stroke="#7ad7ff" stroke-width="12"/>
        <path id="arcFast" fill="none" stroke="#ff8a5a" stroke-width="12"/>
        <g id="clockTicks"></g>
        <text x="-62" y="62" text-anchor="middle" font-family="Silkscreen,monospace" font-size="13" fill="#2a6a8a">SLOW</text>
        <text x="62" y="62" text-anchor="middle" font-family="Silkscreen,monospace" font-size="13" fill="#a8401c">FAST</text>
        <line id="clockHand" x1="0" y1="10" x2="0" y2="-86" stroke="#141414" stroke-width="7" stroke-linecap="round"/>
        <circle r="9" fill="#141414"/><circle r="4" fill="#ffd27a"/>
      </svg>
      <p class="newbest" id="clockLbl" style="color:var(--ember);font-size:22px">×1</p>
      <button class="btn" id="clockGo" type="button">SET TIME</button>
    </div>
  </div>

  <div class="overlay" id="shopScreen" hidden>
    <div class="panel" style="width:min(760px,100%)">
      <h2 class="title" style="font-size:clamp(28px,6vw,40px)">ARMOURY</h2>
      <p class="newbest" id="shopGP">GP 0</p>
      <div class="shopgrid" id="shopGrid"></div>
      <button class="btn" id="shopNext" type="button">NEXT LEVEL ▶</button>
    </div>
  </div>

  <div class="overlay" id="pauseScreen" hidden>
    <div class="panel">
      <h2 class="title" style="font-size:44px">PAUSED</h2>
      <button class="btn" id="resumeBtn" type="button">RESUME</button>
      <button class="btn" id="restartBtn" type="button" style="background:#5d5478;color:var(--bone)">RESTART</button>
    </div>
  </div>

  <div class="overlay" id="overScreen" hidden>
    <div class="panel">
      <h2 class="title" id="overTitle" style="font-size:clamp(38px,11vw,54px)">YOU <em>FELL</em></h2>
      <p class="newbest" id="newBest" hidden>NEW BEST</p>
      <div class="stats">
        <div class="stat"><span>Kills</span><b id="oKills">0</b></div>
        <div class="stat"><span>Headshots</span><b id="oHeads">0</b></div>
        <div class="stat"><span>Best</span><b id="oBest">0</b></div>
      </div>
      <button class="btn" id="againBtn" type="button">FIGHT AGAIN</button>
    </div>
  </div>
</div>

<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) * 1.15;
const G = 700;
const NAMES = ['Twig', 'Flint', 'Quill', 'Sparrow', 'Thorn', 'Hawk', 'Ash', 'Raven', 'Viper', 'Ghost', 'Reaper', 'Wren', 'Cinder', 'Shade'];
const PAD = 11, PAD_GAP = 6;
const barrierX = () => st.P.x + 72, barrierTop = () => -st.P.h - 175, barrierBot = () => -st.P.h + 12;
const POWERS = {
  triple: { name: 'TRIPLE SHOT', short: 'TRIPLE', col: '#9fe8ff', shots: 6 },
  fire:   { name: 'FLAMING ARROWS', short: 'FIRE', col: '#ff9a45', shots: 6 },
  ice:    { name: 'ICE ARROWS',  short: 'ICE',    col: '#bfe9ff', shots: 6 },
  boom:   { name: 'EXPLOSIVE',   short: 'BOOM',   col: '#ff5a4e', shots: 5 },
  heavy:  { name: 'HEAVY BOW',   short: 'HEAVY',  col: '#ffd27a', shots: 6 },
  rapid:  { name: 'RAPID DRAW',  short: 'RAPID',  col: '#7dff9a', shots: 10 },
  pierce: { name: 'PIERCING',    short: 'PIERCE', col: '#e0e0ff', shots: 6 },
  homing: { name: 'HOMING',      short: 'HOMING', col: '#ff8ad8', shots: 4 },
  storm:  { name: 'CHAIN LIGHTNING', short: 'ZAP', col: '#fff36b', shots: 5 },
  cluster:{ name: 'CLUSTER',     short: 'CLUSTER', col: '#ffb3f0', shots: 4 },
  scope:  { name: 'SCOPE',       short: 'SCOPE',  col: '#a8ffef', shots: 6 },
  shield: { name: 'BARRIER',     short: 'BARRIER', col: '#8fc8ff', shots: 0, rare: true },
  slowmo: { name: 'SLOW-MO',     short: 'SLOW',   col: '#7ad7ff', shots: 3, rare: true },
  tornado:{ name: 'TORNADO',     short: 'TWISTER', col: '#d6e4f0', shots: 3 },
  shrink: { name: 'SHRINK ARROWS', short: 'SHRINK', col: '#b6ff5c', shots: 6 },
  tele:   { name: 'TELEPORT ARROWS', short: 'TELEPORT', col: '#d58cff', shots: 4 },
  meteor: { name: 'METEOR SHOWER', short: 'METEOR', col: '#ff7b3a', shots: 1, mega: true },
  blackhole:{ name: 'BLACK HOLE', short: 'VOID',   col: '#b07cff', shots: 1, ultra: true }
};
// linked arrows carry two powers (pk + pk2); these helpers treat both the same
const hasPk = (ar, k) => !!ar && (ar.pk === k || ar.pk2 === k);
const pkMul = k => k === 'fire' ? 1.2 : k === 'heavy' ? 1.35 : k === 'slowmo' ? .3 : 1;
const powShort = q => q.k2 ? POWERS[q.k].short + '+' + POWERS[q.k2].short : POWERS[q.k].short;
const powName = q => q.k2 ? powShort(q) : POWERS[q.k].name;
// a picture for every shop item and arrow type (shop cards and the quiver buttons)
const ICON = {
  hp: '❤️', dmg: '🗡️', barrier: '🧱', reload: '⏱️', quiver: '🏹', crates: '📦', medkits: '🩹', aim: '📏',
  armour: '🛡️', leech: '🧛', revive: '💨', glass: '🪟', helper: '🤝',
  pw_triple: '🔱', pw_fire: '🔥', pw_ice: '❄️', pw_boom: '💥', pw_heavy: '🪨', pw_rapid: '⏩', pw_pierce: '📌',
  pw_homing: '🎯', pw_storm: '⚡', pw_cluster: '🎆', pw_scope: '🔭', pw_slowmo: '🐢', pw_tornado: '🌪️',
  pw_shrink: '🤏', pw_tele: '🌀', pw_blackhole: '🕳️', pw_meteor: '☄️', pw_shield: '🧱'
};

let W = 0, H = 0, DPR = 1, sc = 1, camX = 0, camY = 0, scBase = 1, zoom = 1, forcePortrait = false;
try { const z = +localStorage.getItem('stickZoom'); if (z >= .5 && z <= 1.8) zoom = z; } catch (e) {}
let st = null, running = false, paused = false, last = 0, best = 0, uid = 0;
try { best = +localStorage.getItem('stickDuelBest') || 0; } catch (e) {}

const GROUND = 30;
const SX = x => (x - camX) * sc, SY = y => H - GROUND + camY + y * sc;
const homeCam = () => st.P.x - (W / sc) * .2 - (st.helpers ? st.helpers.length * 45 : 0);
const show = (id, on) => { $(id).hidden = !on; };

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const r = cv.getBoundingClientRect();
  W = r.width; H = r.height;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  scBase = Math.min((H - GROUND) / 345, W / 470); sc = scBase * zoom;
  if (st) camX = homeCam();
}

const SPECKS = [];
for (let i = 0; i < 90; i++) SPECKS.push({ x: Math.random(), y: Math.random(), r: rand(.8, 2), v: rand(4, 14) });

function mkArcher(x, h, f, hp, isP, pw) {
  return { id: ++uid, x, h, f, hp, max: hp, pw, aim: f > 0 ? -.35 : Math.PI + .35, pow: 0, stuck: [], dead: false,
    rot: 0, vr: 0, dy: 0, vy: 0, vx: 0, dx: 0, headRed: 0, hitT: 0, isP, rise: 0,
    aiT: 0, aiAim: null, aiShots: 0 };
}
const feet = a => ({ x: a.x + a.dx, y: -a.h + a.dy });
const sizeOf = a => 1 - (a.shrink || 0);
const shoulder = a => { const f = feet(a); return { x: f.x, y: f.y - 64 * sizeOf(a) }; };
const alive = () => st.enemies.filter(e => !e.dead);
const farX = () => Math.max(...st.enemies.map(e => e.x));

function newGame() {
  st = { helpers: [], reloadMul: 1, extraShots: 0, extraCrates: 0, extraHp: 0, longAim: false, armour: 0, leech: 0, revive: 0, winBonus: 0, dmgBoost: 1, shopBuys: {}, shop: false, level: 1, kills: 0, heads: 0, gp: 0, arrows: [], parts: [], texts: [], pinned: [], enemies: [], gadgets: [],
    wind: 0, camHold: 0, camLast: 0, camFocus: null, lastShot: null, slow: 0, shake: 0, hint: true,
    nextT: 0, t: 0, reload: 0, overT: 0, banner: null, power: null, quiver: [], links: 0, linking: false, linkA: -1, marchers: [], marchQ: [], marchT: 0, allies: [], allyQ: 0, allyT: 0, gateCD: 0, gateOpen: 0, gateHint: true, overReason: null, barrier: null, bolts: [], rings: [], glows: [], fires: [], flashA: 0, flashC: '#fff', tornados: [], holes: [], weather: 'clear', combo: 0, stormT: 0, windT: 0, boltT: 8 };
  st.P = mkArcher(0, rand(140, 175), 1, 100, true, 72);
  try { const q = new URLSearchParams(location.search), lv = +q.get('lv'); if (lv > 1) st.level = Math.min(99, Math.floor(lv)); if (q.has('debug')) window.__sd = { get st() { return st; }, step(n, dt = 1 / 60) { for (let i = 0; i < n; i++) if (!st.shop && !st.clockOpen) update(dt); draw(); }, fire(ang, v, pk) { fire(st.P, ang, v, pk); }, give(k, n) { givePower(k, n); }, pick(i) { pickSlot(i); }, link() { toggleLink(); }, split() { for (const a of st.arrows.filter(a => !a.done && !a.split && a.owner === st.P && hasPk(a, 'cluster'))) splitCluster(a); } }; } catch (e) {}
  spawnLevel(true);
  camX = homeCam();
}

function spawnLevel(first) {
  const lv = st.level, n = Math.min(lv, 6);
  st.enemies = [];
  // each archer gets its own random spot: some close, some far
  const xs = [], maxX = 1700 + Math.min(lv, 10) * 50;
  for (let i = 0; i < n; i++) {
    let x = 0;
    for (let tries = 0; tries < 40; tries++) {
      const r = Math.random();
      x = r < .3 ? rand(520, 820) : r < .65 ? rand(820, 1250) : rand(1250, maxX);
      if (xs.every(o => Math.abs(o - x) > 120)) break;
    }
    xs.push(x);
  }
  xs.sort((a, b) => a - b);
  const bossLv = lv % 5 === 0;
  for (let i = 0; i < n; i++) {
    const boss = bossLv && i === n - 1;
    const hp = Math.round((50 + lv * 8) * (boss ? 1.8 : 1));
    const e = mkArcher(xs[i], rand(60, 205), -1, hp, false, 54);
    e.name = boss ? 'BOSS' : NAMES[(lv * 3 + i) % NAMES.length];
    e.boss = boss; e.chops = []; e.kind = 'archer';
    if (boss) { const bx = Math.min(xs[i], 1400); e.ship = { baseX: bx, ph: rand(0, 6), tx: bx, th: 120, vx: 0, vh: 0, wT: 0, leak: 0, puffT: 0, sinking: false, down: false }; e.x = bx; e.h = rand(110, 130); e.pw = 70; }
    else if (lv >= 3) {
      const r = Math.random();
      if (lv >= 5 && n >= 2 && r < .14 && !st.enemies.some(o => o.kind === 'healer')) e.kind = 'healer';
      else if (lv >= 4 && r < .32) e.kind = 'mage';
      else if (r < .52) e.kind = 'crossbow';
      if (Math.random() < .35) e.cover = { hp: 3, max: 3 };
    }
    e.dy = first ? 0 : 420 + i * 90; e.rise = first ? 0 : 1;
    e.aiT = (first ? 3 : 2.4) + i * rand(.7, 1.3);
    st.enemies.push(e);
  }
  st.wind = lv >= 4 ? Math.round(rand(-1, 1) * Math.min(100, (lv - 3) * 14)) : 0;
  st.pinned = st.pinned.filter(p => p.x < 200);
  st.marchers = []; if (SOLDIERS) buildMarchQueue(); else st.marchQ = []; st.allies = []; st.allyQ = 0; st.gateCD = Math.min(st.gateCD, 3);
  st.tornados = []; st.holes = []; st.showers = []; st.rocks = []; st.timeScale = 1;
  const wr = Math.random();
  st.weather = lv < 3 || bossLv ? 'clear' : wr < .45 ? 'clear' : wr < .63 ? 'night' : wr < .82 ? 'storm' : 'fog';
  if (st.weather === 'storm') { st.wind = Math.round(rand(-120, 120)); st.windT = st.wind; st.stormT = rand(2.5, 4); }
  spawnGadgets();
  const wx = { clear: '', night: ' · NIGHT', storm: ' · STORM', fog: ' · FOG' }[st.weather];
  st.banner = { t: bossLv ? 'BOSS LEVEL ' + lv : 'LEVEL ' + lv, sub: (n === 1 ? '1 ARCHER' : n + ' ARCHERS') + wx, life: 2.4 };
}

/* ---------- gadgets: fans, windows, health ---------- */
function spawnGadgets() {
  st.gadgets = [];
  const far = farX(), count = Math.min(5, 2 + Math.floor(st.level / 2));
  const spots = [];
  const ok = (x, y) => spots.every(s => Math.abs(s.x - x) > 200 || Math.abs(s.y - y) > 170);
  for (let i = 0; i < count; i++) {
    let x = 0, y = 0;
    for (let tries = 0; tries < 30; tries++) {
      x = i === 0 ? rand(300, 560) : rand(260, far - 180);
      y = rand(Math.max(-300, topY() + 115), -140);
      if (ok(x, y)) break;
    }

  if (!a || !b || a === b || a.k2 || b.k2) return;
  if (b.k === 'cluster') [a, b] = [b, a];   // cluster first, so its split arrows carry the other power
  const rare = k => POWERS[k].ultra || POWERS[k].mega;   // black hole / meteor stay one-offs
  const q = { k: a.k, k2: b.k, shots: rare(a.k) || rare(b.k) ? Math.min(a.shots, b.shots) : Math.max(a.shots, b.shots) };
  const at = Math.min(i, j);
  st.quiver = st.quiver.filter(o => o !== a && o !== b); st.quiver.splice(at, 0, q);
  st.power = q; st.links--; st.linking = false; st.linkA = -1;
  const f = feet(st.P);
  text(f.x, f.y - 150, 'LINKED: ' + powShort(q), '#7dffe8', 18, 1.8);
  ring(f.x, f.y - 60, 70, '#7dffe8', .6, 3); sfx('heal');
}
function linkTap(i) {
  const q = st.quiver[i];
  if (!q || q.k2) return;
  if (st.linkA < 0 || st.linkA === i) { st.linkA = st.linkA === i ? -1 : i; sfx('click'); return; }
  linkSlots(st.linkA, i);
}
function toggleLink() {
  if (!st || !st.links) return;
  if (st.linking) { st.linking = false; st.linkA = -1; sfx('click'); return; }
  if (st.quiver.filter(o => !o.k2).length < 2) { text(feet(st.P).x, feet(st.P).y - 150, 'NEED 2 ARROW TYPES TO LINK', '#7dffe8', 14, 1.6); sfx('click'); return; }
  st.linking = true; st.linkA = -1; sfx('click');
}
function pickSlot(i) {   // -1 = plain arrows
  if (!st) return;
  if (st.linking) { if (i >= 0) linkTap(i); return; }
  const q = i >= 0 ? st.quiver[i] : null;
  if (i >= 0 && !q) return;
  st.power = q; sfx('click');
}
let quiverSig = '';
function drawQuiver() {
  const box = $('quiver'), on = running && st && !st.shop && !st.clockOpen && !st.P.dead;
  box.classList.toggle('linking', !!(st && st.linking));
  if (box.hidden === on) box.hidden = !on;
  if (!on) return;
  const sig = st.quiver.map(o => o.k + (o.k2 || '') + o.shots).join() + '|' + st.quiver.indexOf(st.power) + '|' + st.links + st.linking + st.linkA;
  if (sig === quiverSig) return;
  quiverSig = sig;
  const sel = st.quiver.indexOf(st.power);
  const L = st.linking;
  let h = L ? `<div class="qhint">LINKING: TAP 2 ARROW TYPES TO JOIN THEM</div>` : '';
  h += `<button type="button" data-i="-1" class="${sel < 0 && !L ? 'on' : ''}"${L ? ' disabled' : ''}><i class="qi">➶</i><span>PLAIN</span><small>∞</small></button>`;
  for (let i = 0; i < QUIVER_SLOTS; i++) {
    const o = st.quiver[i];
    const cls = L ? (st.linkA === i ? 'on' : o && o.k2 ? 'empty' : 'pickme') : sel === i ? 'on' : '';
    h += o ? `<button type="button" data-i="${i}" class="${cls}"${L && o.k2 ? ' disabled' : ''}><i class="qi">${ICON['pw_' + o.k] || ''}${o.k2 ? ICON['pw_' + o.k2] || '' : ''}</i><span style="color:${POWERS[o.k].col}">${powShort(o)}</span><small>×${o.shots}</small></button>`
           : `<button type="button" class="empty" disabled><i class="qi">·</i><span>EMPTY</span><small>—</small></button>`;
  }
  if (st.links) h += `<button type="button" data-link="1" class="link${L ? ' on' : ''}"><i class="qi">🔗</i><span>${L ? 'CANCEL' : 'LINK'}</span><small>×${st.links}</small></button>`;
  box.innerHTML = h;
}
$('quiver').addEventListener('pointerdown', e => e.stopPropagation());
$('quiver').addEventListener('click', e => { if (e.target.closest('button[data-link]')) { toggleLink(); return; } const b = e.target.closest('button[data-i]'); if (b) pickSlot(+b.dataset.i); });
addEventListener('keydown', e => { const n = +e.key; if (running && n >= 1 && n <= 4) pickSlot(n - 2); else if (running && (e.key === 'l' || e.key === 'L')) toggleLink(); });

/* ---------- input ---------- */
/* ---------- pinch with two fingers (or the mouse wheel) to zoom in and out ---------- */
const ZMIN = .5, ZMAX = 1.8, fingers = new Map();
let pinch = null, pinchLock = false, zoomShowT = 0;
function setZoom(z, cx) {
  z = clamp(z, ZMIN, ZMAX); if (Math.abs(z - zoom) < .001) return;
  const wx = camX + cx / sc; zoom = z; sc = scBase * zoom; camX = wx - cx / sc; zoomShowT = performance.now();
  try { localStorage.setItem('stickZoom', zoom.toFixed(2)); } catch (e) {}
}
const twoFingers = () => [...fingers.values()].slice(0, 2);
// these run before the aiming handlers; while two fingers are down they swallow the touches so nothing fires
cv.addEventListener('pointerdown', e => {
  if (e.isPrimary) { fingers.clear(); pinch = null; pinchLock = false; }
  fingers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (fingers.size >= 2) {
    if (!pinch) { const [a, b] = twoFingers(); pinch = { d0: Math.max(20, Math.hypot(a.x - b.x, a.y - b.y)), z0: zoom }; pinchLock = true; cancelAim(); }
    e.stopImmediatePropagation();
  } else if (pinchLock) e.stopImmediatePropagation();
}, true);
cv.addEventListener('pointermove', e => {
  if (!fingers.has(e.pointerId)) return;
  fingers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && fingers.size >= 2) {
    const [a, b] = twoFingers(), r = cv.getBoundingClientRect();
    setZoom(pinch.z0 * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d0, (a.x + b.x) / 2 - r.left);
  }
  if (pinchLock) e.stopImmediatePropagation();
}, true);
function fingerUp(e) {
  fingers.delete(e.pointerId);
  if (fingers.size < 2) pinch = null;
  const locked = pinchLock;
  if (!fingers.size) pinchLock = false;
  if (locked) e.stopImmediatePropagation();
}
cv.addEventListener('pointerup', fingerUp, true);
cv.addEventListener('pointercancel', fingerUp, true);
cv.addEventListener('wheel', e => { e.preventDefault(); const r = cv.getBoundingClientRect(); setZoom(zoom * Math.exp(-e.deltaY * .0015), e.clientX - r.left); }, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
// zoomed in: slide the view up so your archer stays on screen (never shows below the ground)
function camYTarget() {
  if (!st) return 0;
  const P = st.P, yF = P && !P.dead && P.inLevel !== false ? -(P.h + 95) : -230;
  return Math.max(0, H * .3 - (H - GROUND + yF * sc));
}
function drawZoomNote() {
  const k = 1 - (performance.now() - zoomShowT) / 900;
  if (k <= 0) return;
  ctx.globalAlpha = Math.min(1, k * 2); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '700 16px Silkscreen, monospace'; ctx.fillStyle = 'rgba(20,10,30,.6)'; ctx.fillText('ZOOM ' + zoom.toFixed(1) + '×', W / 2 + 1, H * .62 + 2);
  ctx.fillStyle = '#f6eedf'; ctx.fillText('ZOOM ' + zoom.toFixed(1) + '×', W / 2, H * .62);
  ctx.globalAlpha = 1;
}
function cancelAim() { drag = null; if (st) st.P.pow = 0; }

let drag = null;
cv.addEventListener('pointerdown', e => {
  if (!running || paused || st.P.dead) return;
  drag = { id: e.pointerId, x: e.clientX, y: e.clientY };
  st.camHome = true;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
});
cv.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id || st.P.dead) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y, len = Math.hypot(dx, dy);
  st.P.pow = clamp(len / 120, 0, 1);
  if (len > 6) {
    let a = Math.atan2(-dy, -dx);
    if (a > .7 && a < Math.PI - .7) a = a < Math.PI / 2 ? .7 : Math.PI - .7;
    st.P.aim = a; st.P.f = Math.cos(a) < 0 ? -1 : 1;
  }
});
function release() {
  const P = st && st.P;
  if (drag && P && !P.dead && running && !paused) {
    const cl = P.pow <= .1 ? st.arrows.filter(a => !a.done && !a.split && a.owner === P && hasPk(a, 'cluster')) : [];
    if (cl.length) { for (const a of cl) splitCluster(a); }   // a tap (no pull) bursts any cluster arrow in the air
    else if (P.pow > .1 && st.reload <= 0) {
      const pk = st.power ? st.power.k : null, pk2 = st.power ? st.power.k2 || null : null;
      const n0 = st.arrows.length;
      fire(P, P.aim, 300 + P.pow * 1100, pk, pk2);
      if ((pk === 'cluster' || pk2 === 'cluster') && (st.splitHints = (st.splitHints || 0) + 1) <= 3) text(feet(P).x, feet(P).y - 150, 'TAP THE SCREEN TO SPLIT IT', '#ffb3f0', 14, 1.6);
      const vol = { alive: st.arrows.length - n0, hits: 0 };
      for (let q = n0; q < st.arrows.length; q++) st.arrows[q].vol = vol;
      if (st.power && --st.power.shots <= 0) { text(feet(P).x, feet(P).y - 130, powShort(st.power) + ' EMPTY', '#f6eedf', 14, 1); st.quiver = st.quiver.filter(o => o !== st.power); st.power = null; }
      st.camHome = false;
      st.reload = (pk === 'rapid' || pk2 === 'rapid' ? .2 : .55) * st.reloadMul; st.hint = false; st.lastShot = { p: P.pow, a: P.aim };
    }
    P.pow = 0;
  }
  drag = null;
}
cv.addEventListener('pointerup', e => { if (drag && e.pointerId === drag.id) release(); });
cv.addEventListener('pointercancel', () => { drag = null; if (st) st.P.pow = 0; });

/* ---------- sound ---------- */
let AC = null;
const SFX = { twang: ['triangle', 260, 90, .12, .16, .12], hit: ['square', 160, 60, .08, .1, .1], head: ['square', 520, 120, .12, .16, .12],
  thud: ['sine', 120, 50, .08, .1, .1], kill: ['sawtooth', 220, 40, .4, .5, .12], click: ['square', 900, 1400, .05, .07, .08],
  glass: ['triangle', 1800, 900, .12, .16, .08], bell: ['sine', 880, 860, 1.2, 1.4, .16], whoosh: ['sawtooth', 300, 80, .4, .5, .05], void: ['sine', 220, 30, 1.2, 1.4, .2], crack: ['square', 300, 90, .1, .14, .1], zap: ['square', 1200, 200, .2, .25, .08], boom: ['sawtooth', 140, 30, .3, .4, .16], heal: ['triangle', 500, 1200, .25, .3, .12] };
function sfx(t) {
  if (!AC || AC.state !== 'running') return;
  const P = SFX[t], now = AC.currentTime;
  try {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = P[0]; o.frequency.setValueAtTime(P[1], now); o.frequency.exponentialRampToValueAtTime(P[2], now + P[3]);
    g.gain.setValueAtTime(P[5], now); g.gain.exponentialRampToValueAtTime(.0001, now + P[4]);
    o.connect(g); g.connect(AC.destination); o.start(now); o.stop(now + P[4] + .02);
  } catch (e) {}
}

/* ---------- music: soft procedural loop (A minor pentatonic) ---------- */
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const Music = {
  on: true, out: null, next: 0, step: 0, timer: null, mel: 2, noise: null,
  BAR: [[45, 'm'], [41, 'M'], [48, 'M'], [43, 'M']], SCALE: [69, 72, 74, 76, 79, 81, 84],
  init() {
    if (!AC || this.out) return;
    this.out = AC.createGain(); this.out.gain.value = 0;
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
    this.out.connect(lp); lp.connect(AC.destination);
    const len = AC.sampleRate * .2, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noise = buf;
  },
  start() {
    if (!AC) return;
    this.init();
    this.out.gain.cancelScheduledValues(AC.currentTime);
    this.out.gain.setTargetAtTime(this.on ? .9 : 0, AC.currentTime, .8);
    if (!this.timer) { this.next = AC.currentTime + .15; this.timer = setInterval(() => this.tick(), 80); }
  },
  fade() { if (this.out) this.out.gain.setTargetAtTime(0, AC.currentTime, .4); },
  tick() {
    if (!AC || AC.state !== 'running') return;
    const eighth = 60 / 84 / 2;
    while (this.next < AC.currentTime + .35) { this.play(this.step, this.next); this.next += eighth; this.step++; }
  },
  note(type, freq, t, dur, vol, attack = .01) {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(this.out); o.start(t); o.stop(t + dur + .05);
  },
  play(step, t) {
    const s8 = step % 8, bar = Math.floor(step / 8) % 4, [root, q] = this.BAR[bar];
    if (s8 === 0) {
      // pad chord
      for (const iv of [12, q === 'm' ? 15 : 16, 19]) this.note('sine', mtof(root + iv), t, 2.6, .028, .5);
      this.note('triangle', mtof(root), t, 1.6, .09, .02);
    }
    if (s8 === 4) this.note('triangle', mtof(root + 7), t, 1, .06, .02);
    // low drum
    if (s8 === 0 || s8 === 5) {
      const o = AC.createOscillator(), g = AC.createGain();
      o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(45, t + .2);
      g.gain.setValueAtTime(.16, t); g.gain.exponentialRampToValueAtTime(.0001, t + .3);
      o.connect(g); g.connect(this.out); o.start(t); o.stop(t + .35);
    }
    // soft shaker
    if (s8 % 2 === 1) {
      const n = AC.createBufferSource(), hp = AC.createBiquadFilter(), g = AC.createGain();
      n.buffer = this.noise; hp.type = 'highpass'; hp.frequency.value = 6000;
      g.gain.setValueAtTime(.025, t); g.gain.exponentialRampToValueAtTime(.0001, t + .06);
      n.connect(hp); hp.connect(g); g.connect(this.out); n.start(t); n.stop(t + .08);
    }
    // plucked melody
    if (Math.random() < (s8 % 2 === 0 ? .62 : .28)) {
      this.mel = clamp(this.mel + Math.round(rand(-2, 2)), 0, this.SCALE.length - 1);
      const f = mtof(this.SCALE[this.mel]);
      this.note('triangle', f, t, .7, .05, .005);
      this.note('sine', f * 2, t, .25, .012, .005);
    }
  }
};
$('musicBtn').onclick = () => {
  Music.on = !Music.on; $('musicBtn').classList.toggle('off', !Music.on);
  if (Music.on && running && !paused) Music.start(); else Music.fade();
};

/* ---------- flow ---------- */
function start() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.resume) AC.resume().catch(() => {});
  newGame(); running = true; paused = false;
  Music.start();
  show('startScreen', false); show('overScreen', false); show('pauseScreen', false); show('shopScreen', false); show('clockScreen', false);
}
function gameOver() {
  running = false; Music.fade();
  const isBest = st.kills > best;
  if (isBest) { best = st.kills; try { localStorage.setItem('stickDuelBest', best); } catch (e) {} }
  $('overTitle').innerHTML = st.overReason === 'castle' ? 'CASTLE <em>FELL</em>' : 'YOU <em>FELL</em>';
  $('oKills').textContent = st.kills; $('oHeads').textContent = st.heads; $('oBest').textContent = best;
  $('newBest').hidden = !isBest || st.kills === 0;
  show('overScreen', true);
}
function setPause(p) { if (!running) return; paused = p; show('pauseScreen', p); if (p) Music.fade(); else if (Music.on) Music.start(); }
$('playBtn').onclick = start; $('againBtn').onclick = start; $('restartBtn').onclick = start;
$('resumeBtn').onclick = () => setPause(false);
$('pauseBtn').onclick = () => setPause(!paused);
$('portraitBtn').onclick = () => { forcePortrait = true; show('rotateScreen', false); };
if (best) $('bestLine').textContent = 'Best: ' + best + ' kills · plays sideways';
document.addEventListener('visibilitychange', () => { if (document.hidden) setPause(true); });
addEventListener('keydown', e => { if ((e.key === 'Escape' || e.key === 'p') && running) setPause(!paused); });
addEventListener('resize', resize);

resize(); newGame();
requestAnimationFrame(frame);
})();
