<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f2a4a">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0}[hidden]{display:none!important}</style>
<title>Stick Duel Versus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Rubik:wght@400;600;800&display=swap">
<style>
/* Layout: full-screen canvas duel, lobby and round cards float over it. Single deliberate dusk theme, shared with Stick Duel. */
:root{
  --dusk:#1f2a4a; --ember:#f2a65a; --bone:#f6eedf; --blood:#e23b2e; --muted:#b9b0c8; --teal:#3fd0c9;
  --pixel:'Silkscreen','Courier New',monospace;
  --body:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;background:var(--dusk)}
body{height:100%;margin:0;background:var(--dusk);color:var(--bone);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{position:relative;width:100%;height:100%;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:rgba(22,18,38,.8);overflow-y:auto}
.panel{width:min(420px,100%);display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.title{font-family:var(--pixel);font-weight:700;font-size:clamp(34px,8vw,56px);line-height:.95;margin:0;letter-spacing:.02em;text-wrap:balance}
.title em{font-style:normal;color:var(--blood)}
.status{font-family:var(--pixel);font-size:14px;color:var(--ember);margin:0;min-height:1.4em}
.small{font-size:13px;color:var(--muted);margin:0;max-width:40ch;line-height:1.4}
.btn{font-family:var(--pixel);font-weight:700;font-size:18px;letter-spacing:.06em;color:#24150a;background:var(--ember);border:0;padding:13px 28px;cursor:pointer}
.btn.alt{background:#5d5478;color:var(--bone);font-size:14px;padding:10px 20px}
.btn:active{transform:translateY(2px)}
.btn:focus-visible,#homeBtn:focus-visible,#quitBtn:focus-visible{outline:3px solid var(--blood);outline-offset:3px}
.dots{display:flex;gap:10px;justify-content:center}
.code{font-family:var(--pixel);font-size:54px;letter-spacing:.18em;color:var(--ember);margin:0}
.codein{font-family:var(--pixel);font-size:34px;letter-spacing:.2em;text-align:center;width:6.5ch;padding:8px 10px;background:rgba(246,238,223,.1);color:var(--bone);border:2px solid rgba(246,238,223,.3);text-transform:uppercase}
.codein:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
.dot{width:14px;height:14px;border-radius:50%;background:rgba(246,238,223,.18)}
.dot.me{background:var(--teal)} .dot.opp{background:var(--blood)}
#homeBtn{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:14px;padding:10px 16px;border:0;cursor:pointer;font:700 14px var(--pixel);letter-spacing:.06em;color:#24150a;background:var(--ember);box-shadow:0 3px 0 rgba(0,0,0,.35)}
#quitBtn{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:14px;padding:8px 12px;border:0;cursor:pointer;font:700 12px var(--pixel);color:var(--bone);background:rgba(93,84,120,.85)}
</style>

</head>
<body>
<div id="app">
  <canvas id="c" aria-label="Stick Duel Versus game area"></canvas>
  <button id="homeBtn" type="button" hidden>◀ ARCHER</button>
  <button id="quitBtn" type="button" hidden>LEAVE</button>

  <div class="overlay" id="lobby">
    <div class="panel">
      <h1 class="title">STICK DUEL<br><em>VERSUS</em></h1>
      <p class="status" id="lobbyStatus">Play live against someone on another device, or practise.</p>
      <div id="lobbyMain" class="panel" style="gap:10px">
        <button class="btn" id="hostBtn" type="button">HOST GAME</button>
        <button class="btn" id="joinOpen" type="button">JOIN GAME</button>
      </div>
      <div id="codeBox" hidden><p class="code" id="codeOut">----</p><p class="small">Waiting for them to join…</p></div>
      <div id="joinBox" class="panel" style="gap:10px" hidden>
        <label class="small" for="codeIn">Enter the 4-letter code</label>
        <input id="codeIn" class="codein" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD">
        <button class="btn" id="joinBtn" type="button">JOIN</button>
      </div>
      <button class="btn" id="liveBtn" type="button" hidden>PLAY LIVE</button>
      <button class="btn alt" id="cancelBtn" type="button" hidden>CANCEL</button>
      <button class="btn alt" id="botBtn" type="button">PRACTISE VS BOT</button>
      <a class="small" href="solo.html" style="color:var(--ember)">Play the full single-player game ▶</a>
      <a class="small" href="coop.html" style="color:var(--ember)">Team up: co-op for 2 or more players ▶</a>
    </div>
  </div>

  <div class="overlay" id="endScreen" hidden>
    <div class="panel">
      <h2 class="title" id="endTitle">YOU <em>WIN</em></h2>
      <div class="dots" id="endDots"></div>
      <p class="status" id="endStatus"></p>
      <button class="btn" id="rematchBtn" type="button">REMATCH</button>
      <button class="btn alt" id="lobbyBtn" type="button">BACK TO LOBBY</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const show = (id, on) => { $(id).hidden = !on; };
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) * 1.15;
const G = 700, STEP = 1 / 120, RELOAD = .8, WINS = 2;

let W = 0, H = 0, DPR = 1, sc = 1, camX = 0;
const GROUND = 30;
const SX = x => (x - camX) * sc, SY = y => H - GROUND + y * sc;
const SPECKS = [];
for (let i = 0; i < 90; i++) SPECKS.push({ x: Math.random(), y: Math.random(), r: rand(.8, 2), v: rand(4, 14) });

let st = null;            // the current round
let match = null;         // { vs: 'bot'|'live', round, score: {me, opp}, id }
let isHost = false, oppP = {};
let myShots = [], shotSeq = 0, seenOpp = 0, lastPres = '', noAuto = false;

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const r = cv.getBoundingClientRect();
  W = r.width; H = r.height;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  sc = Math.min((H - GROUND) / 345, W / 470);
}
const homeCam = () => st.me.x - (W / sc) * .2;

/* ---------- layout: host makes it in its own frame, guest mirrors ---------- */
function genLayout() {
  const D = Math.round(rand(760, 1150)), L = { D, hostH: Math.round(rand(110, 190)), guestH: Math.round(rand(110, 190)), wind: Math.round(rand(-70, 70)), items: [] };
  const n = 2 + Math.floor(Math.random() * 3);
  for (let i = 0; i < n; i++) {
    const x = Math.round(D * (.2 + .6 * (i + rand(.15, .85)) / n)), y = Math.round(rand(-300, -150));
    if (Math.random() < .6) L.items.push({ t: 'win', x, y, m: Math.random() < .7 ? 2 : 3 });
    else L.items.push({ t: 'fan', x, y, a: [0, Math.PI / 2, Math.PI, -Math.PI / 2, -Math.PI / 4, Math.PI * .75][Math.floor(Math.random() * 6)] });
  }
  return L;
}
function mirror(L) {
  return { D: L.D, hostH: L.guestH, guestH: L.hostH, wind: -L.wind, items: L.items.map(it => it.t === 'fan' ? { ...it, x: L.D - it.x, a: Math.PI - it.a } : { ...it, x: L.D - it.x }) };
}
function mkArcher(x, h, f, remote) {
  return { x, h, f, hp: 100, max: 100, aim: f > 0 ? -.35 : Math.PI + .35, pow: 0, stuck: [], dead: false, rot: 0, vr: 0, dy: 0, vy: 0, dx: 0, vx: 0, hitT: 0, headRed: 0, remote };
}
function startRound(L, round) {
  // L is already in MY frame: me on the left at x=0
  st = { t: 0, phase: 'countdown', cd: 3, round, L, D: L.D, wind: L.wind, arrows: [], parts: [], texts: [], pinned: [], acc: 0, reload: 0, endT: 0, winner: null,
    me: mkArcher(0, L.hostH, 1, false), opp: mkArcher(L.D, L.guestH, -1, match.vs === 'live'),
    items: L.items.map((it, i) => ({ ...it, id: i, flash: 0, spin: 0 })), bot: { t: 2.5, aim: null, shots: 0 }, camHold: 0, camHome: false };
  myShots = []; seenOpp = 0;
  camX = homeCam();
  show('lobby', false); show('endScreen', false); show('quitBtn', true);
  pushPresence(true);
}

/* ---------- physics ---------- */
const feet = a => ({ x: a.x + a.dx, y: -a.h + a.dy });
const shoulder = a => { const f = feet(a); return { x: f.x, y: f.y - 64 }; };
function segDist(px, py, ax, ay, bx, by) { const vx = bx - ax, vy = by - ay, t = clamp(((px - ax) * vx + (py - ay) * vy) / (vx * vx + vy * vy), 0, 1); return Math.hypot(px - ax - vx * t, py - ay - vy * t); }
function zone(a, x, y) {
  if (a.dead) return null;
  const f = feet(a), px = x - f.x, py = y - f.y;
  if (Math.hypot(px, py + 84) < 11) return 'head';
  if (segDist(px, py, 0, -72, 0, -40) < 9) return 'body';
  if (segDist(px, py, 0, -40, -9, 0) < 4.5 || segDist(px, py, 0, -40, 9, 0) < 4.5) return 'legs';
  return null;
}
const inPillar = (a, x, y) => Math.abs(x - a.x) < 30 && y > -a.h;
function fire(a, ang, v, mine) {
  const s = shoulder(a), dx = Math.cos(ang), dy = Math.sin(ang);
  st.arrows.push({ x: s.x + dx * 24, y: s.y + dy * 24, vx: dx * v, vy: dy * v, mine, done: false, via: new Set() });
  sfx('twang');
}
function sim(x, y, vx, vy, tx, dir) {
  for (let i = 0; i < 500; i++) {
    vx += st.wind / 60; vy += G / 60; x += vx / 60; y += vy / 60;
    if ((dir < 0 && x <= tx) || (dir > 0 && x >= tx)) return y;
    if (y > 60) return null;
  }
  return null;
}
function solve(from, tx, ty) {
  const s = shoulder(from), dir = Math.sign(tx - s.x);
  let bE = 0, bV = 700, err = 1e9;
  for (let e = -15; e <= 60; e += 1.5) {
    const er = e * Math.PI / 180;
    for (let v = 340; v <= 1200; v += 20) {
      const vx = Math.cos(er) * v * dir, vy = -Math.sin(er) * v, y = sim(s.x + vx / v * 22, s.y + vy / v * 22, vx, vy, tx, dir);
      if (y === null) continue;
      const d = Math.abs(y - ty) + v * .004;
      if (d < err) { err = d; bE = e; bV = v; }
    }
  }
  return { e: bE, v: bV };
}
function stepArrow(ar) {
  ar.vx += st.wind * STEP; ar.vy += G * STEP; ar.x += ar.vx * STEP; ar.y += ar.vy * STEP;
  for (const it of st.items) {
    if (it.t === 'fan') {
      const dx = Math.cos(it.a), dy = Math.sin(it.a), rx = ar.x - it.x, ry = ar.y - it.y, u = rx * dx + ry * dy, v = -rx * dy + ry * dx;
      if (u > 0 && u < 360 && Math.abs(v) < 66) { const f = 1700 * (1 - u / 420); ar.vx += dx * f * STEP; ar.vy += dy * f * STEP; }
    } else if (Math.abs(ar.x - it.x) < 34 && Math.abs(ar.y - it.y) < 41 && !ar.via.has(it.id)) {
      ar.via.add(it.id); it.flash = .25;
      const sp = Math.hypot(ar.vx, ar.vy), base = Math.atan2(ar.vy, ar.vx);
      for (let k = 1; k < it.m; k++) {
        const off = (k % 2 ? 1 : -1) * Math.ceil(k / 2) * .075;
        st.arrows.push({ x: ar.x, y: ar.y, vx: Math.cos(base + off) * sp, vy: Math.sin(base + off) * sp, mine: ar.mine, done: false, via: new Set(ar.via) });
      }
      sfx('glass');
    }
  }
  const tgt = ar.mine ? st.opp : st.me, z = zone(tgt, ar.x, ar.y);
  if (z) { hit(ar, tgt, z); return; }
  for (const a of [st.me, st.opp]) if (inPillar(a, ar.x, ar.y)) { ar.done = true; st.pinned.push({ x: ar.x, y: ar.y, ang: Math.atan2(ar.vy, ar.vx) }); sfx('thud'); return; }
  if (ar.y >= 0) { ar.done = true; st.pinned.push({ x: ar.x, y: -2, ang: Math.atan2(ar.vy, ar.vx) }); sfx('thud'); return; }
  if (ar.x < -600 || ar.x > st.D + 600) ar.done = true;
}
function hit(ar, a, z) {
  ar.done = true;
  const dmg = z === 'head' ? 40 : z === 'body' ? 22 : 12;
  const f = feet(a);
  a.stuck.push({ x: ar.x - f.x, y: ar.y - f.y, ang: Math.atan2(ar.vy, ar.vx) });
  if (a.stuck.length > 12) a.stuck.shift();
  a.hitT = .12; if (z === 'head') a.headRed = 1;
  for (let i = 0; i < (z === 'head' ? 20 : 10); i++) st.parts.push({ x: ar.x, y: ar.y, vx: ar.vx * rand(.05, .2) + rand(-90, 90), vy: rand(-160, 40), life: rand(.5, 1), max: 1, r: rand(1.4, 3), col: '#d4201c' });
  text(f.x, f.y - 104, (z === 'head' ? 'HEADSHOT -' : '-') + dmg, z === 'head' ? '#ff5a4e' : '#f6eedf', z === 'head' ? 18 : 16, 1);
  sfx(z === 'head' ? 'head' : 'hit');
  // whoever owns an archer decides its health: a remote opponent reports its own
  if (!a.remote) { a.hp = Math.max(0, a.hp - dmg); if (a.hp <= 0) die(a, ar.vx); }
  if (a === st.me) pushPresence();
}
function die(a, vx) {
  if (a.dead) return;
  a.dead = true; a.hp = 0; a.vr = Math.sign(vx || 1) * rand(2.5, 4); a.vx = (vx || 0) * .1; a.vy = -120;
  sfx('kill');
}
function text(x, y, t, col, size, life = 1) { st.texts.push({ x, y, t, col, size, life, max: life }); }

/* ---------- round flow ---------- */
function update(dt) {
  st.t += dt;
  for (const it of st.items) { if (it.flash > 0) it.flash -= dt; it.spin += dt * 18; }
  if (st.phase === 'countdown') { st.cd -= dt; if (st.cd <= 0) { st.phase = 'fight'; sfx('wave'); } }
  st.reload -= dt;
  st.acc += dt;
  while (st.acc >= STEP) { st.acc -= STEP; for (const ar of st.arrows) if (!ar.done) stepArrow(ar); }
  st.arrows = st.arrows.filter(a => !a.done);
  if (st.pinned.length > 40) st.pinned.splice(0, st.pinned.length - 40);

  // remote opponent: mirror their reported aim, health and shots
  if (match.vs === 'live') readOpponent();
  else if (st.phase === 'fight') botThink(dt);

  for (const a of [st.me, st.opp]) {
    if (a.hitT > 0) a.hitT -= dt;
    if (a.dead) { a.vy += G * dt; a.dy += a.vy * dt; a.dx += a.vx * dt; a.rot = clamp(a.rot + a.vr * dt, -1.7, 1.7); }
  }
  for (const p of st.parts) { p.vy += G * .7 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  st.parts = st.parts.filter(p => p.life > 0);
  for (const t of st.texts) { t.life -= dt; t.y -= 34 * dt; }
  st.texts = st.texts.filter(t => t.life > 0);

  if (st.phase === 'fight' && (st.me.dead || st.opp.dead)) {
    st.phase = 'end'; st.endT = 3.2;
    st.winner = st.me.dead && st.opp.dead ? 'draw' : st.opp.dead ? 'me' : 'opp';
    if (st.winner === 'me') match.score.me++; else if (st.winner === 'opp') match.score.opp++;
    sfx(st.winner === 'me' ? 'heal' : 'kill');
    pushPresence(true);
  }
  if (st.phase === 'end') {
    st.endT -= dt;
    if (st.endT <= 0 && !st.advanced) {
      st.advanced = true;
      const over = match.score.me >= WINS || match.score.opp >= WINS;
      if (over) endMatch();
      else if (match.vs === 'bot' || isHost) nextRound();
    }
  }

  // camera follows your lead arrow, then comes home
  const viewW = W / sc, home = homeCam();
  let lead = null;
  for (const a of st.arrows) if (a.mine && (!lead || a.x > lead.x)) lead = a;
  let target = home, speed = 3;
  if (st.camHome) { speed = 14; st.camHold = 0; }
  else if (lead) { target = Math.max(home, lead.x - viewW * .5); st.camLast = target; st.camHold = 1.1; speed = 10; }
  else if (st.camHold > 0 && !drag) { st.camHold -= dt; target = st.camLast; speed = 6; }
  camX += (target - camX) * Math.min(1, dt * speed);
}
function nextRound() {
  match.round++;
  const L = genLayout();
  match.layout = L;
  startRound(L, match.round);
  if (match.vs === 'live') pushPresence(true);
}
function endMatch() {
  st.phase = 'over';
  const won = match.score.me > match.score.opp;
  $('endTitle').innerHTML = won ? 'YOU <em>WIN</em>' : 'YOU <em>LOSE</em>';
  const d = $('endDots'); d.innerHTML = '';
  for (let i = 0; i < match.score.me; i++) { const s = document.createElement('span'); s.className = 'dot me'; d.appendChild(s); }
  for (let i = 0; i < match.score.opp; i++) { const s = document.createElement('span'); s.className = 'dot opp'; d.appendChild(s); }
  $('endStatus').textContent = match.score.me + ' – ' + match.score.opp + (match.vs === 'live' && !isHost ? '  ·  waiting for a rematch' : '');
  show('rematchBtn', match.vs === 'bot' || isHost);
  show('endScreen', true); show('quitBtn', false);
  pushPresence(true);
}
function newMatch(vs) {
  show('liveBtn', false); show('cancelBtn', false);
  match = { vs, round: 0, score: { me: 0, opp: 0 }, id: Math.floor(Math.random() * 1e9) };
  nextRound();
}

/* ---------- bot ---------- */
function botThink(dt) {
  const B = st.bot, E = st.opp;
  if (E.dead || st.me.dead) return;
  if (B.aim) {
    B.aim.t += dt; const k = clamp(B.aim.t / .8, 0, 1);
    E.aim = B.aim.from + (B.aim.ang - B.aim.from) * Math.min(1, k * 1.6); E.pow = k;
    if (k >= 1) { fire(E, B.aim.ang, B.aim.v, false); E.pow = 0; B.aim = null; B.t = rand(2, 3); B.shots++; }
  } else if ((B.t -= dt) <= 0) {
    const pf = feet(st.me), sol = solve(E, pf.x, pf.y - (Math.random() < .2 ? 84 : 58));
    const sp = 1 + 2 * Math.pow(.55, B.shots);
    const e = (sol.e + gauss() * 3 * sp) * Math.PI / 180;
    B.aim = { ang: Math.PI + e, v: sol.v + gauss() * 30 * sp, t: 0, from: E.aim };
  }
}

/* ---------- live play: a direct device-to-device link (PeerJS) ---------- */
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
let peer = null, conn = null;
const netOpen = () => !!(conn && conn.open);
function send(P) { if (netOpen()) { try { conn.send(P); } catch (e) {} } }
function pushPresence(force) {
  if (!netOpen()) return;
  let P;
  if (!match || match.vs !== 'live' || !st) P = { v: 1, mid: null, round: 0, phase: 'lobby', shots: [] };
  else {
    P = {
      v: 1, mid: match.id, round: st.round, phase: st.phase === 'over' ? 'over' : 'play',
      hp: Math.round(st.me.hp), dead: st.me.dead, aim: +st.me.aim.toFixed(3), pow: +st.me.pow.toFixed(2),
      shots: myShots.slice(-6), score: [match.score.me, match.score.opp]
    };
    if (isHost) P.layout = match.layout;
  }
  const key = JSON.stringify(P);
  if (!force && key === lastPres) return;
  lastPres = key;
  send(P);
}
function readOpponent() {
  const o = oppP;
  if (!o || o.v !== 1 || o.mid !== match.id || o.round !== st.round) return;
  const E = st.opp;
  if (typeof o.aim === 'number') E.aim = Math.PI - o.aim;
  if (typeof o.pow === 'number') E.pow = o.pow;
  if (typeof o.hp === 'number' && o.hp < E.hp) E.hp = o.hp;
  if (o.dead && !E.dead) die(E, 1);
  if (Array.isArray(o.shots)) for (const s of o.shots) {
    if (!s || typeof s.id !== 'number' || s.id <= seenOpp || s.r !== st.round) continue;
    seenOpp = s.id;
    if (st.phase === 'fight' || st.phase === 'end') fire(E, Math.PI - s.a, s.v, false);
  }
}
function onPeers() {
  if (!netOpen()) {
    oppP = {};
    if (match && match.vs === 'live') { match = null; st = null; toLobby('Your opponent disconnected.'); }
    return;
  }
  if (match && match.vs === 'bot') return;
  if (!match) {
    const hostLive = !isHost && oppP.mid && oppP.layout && oppP.phase === 'play';
    if (noAuto) {
      setLobby(hostLive ? 'Your opponent is ready for a match.' : 'Connected to your opponent.');
      $('liveBtn').textContent = hostLive || isHost ? 'PLAY LIVE' : 'WAITING FOR HOST…';
      show('liveBtn', true); $('liveBtn').disabled = !(hostLive || isHost);
      return;
    }
    setLobby('Connected!');
    if (isHost) newMatch('live');
    else if (hostLive) joinFromHost();
    return;
  }
  if (match.vs === 'live') {
    if (oppP.mid === match.id) match.oppSeen = true;

    if (sub) { ctx.font = '700 14px Silkscreen, monospace'; ctx.fillStyle = '#f6eedf'; ctx.fillText(sub, W / 2, H * .32 + 34); }

  if (st.round === 1 && st.phase === 'countdown') { ctx.textAlign = 'center'; ctx.font = '700 12px Silkscreen, monospace'; ctx.fillStyle = '#f6eedf'; ctx.fillText('PULL BACK & RELEASE · RIVAL IS OFF TO THE RIGHT →', W / 2, H * .32 + 58); }
}
let insetA = 0;
const insetOn = () => insetA > .5;
function drawInset() {
  const away = Math.abs(camX - homeCam()) > 80 && !st.me.dead;
  insetA += ((away ? 1 : 0) - insetA) * .2;
  show('homeBtn', away && st.phase !== 'over');
  if (insetA < .03) return;
  const w = Math.min(170, W * .26), h = w * .68, x0 = 12, y0 = 12, P = st.me;
  const incoming = st.arrows.some(a => !a.mine && Math.abs(a.x - P.x) < 420);
  ctx.save(); ctx.globalAlpha = insetA;
  const bg = ctx.createLinearGradient(0, y0, 0, y0 + h);
  bg.addColorStop(0, '#3e3766'); bg.addColorStop(.6, '#a0587a'); bg.addColorStop(1, '#ea8a5e');
  ctx.fillStyle = bg; ctx.fillRect(x0, y0, w, h);
  ctx.beginPath(); ctx.rect(x0, y0, w, h); ctx.clip();
  const oc = camX, os = sc;
  sc = h / (P.h + 105); camX = P.x - (w / sc) * .45;
  ctx.translate(x0, y0 + h - 6 - (H - GROUND));
  ctx.fillStyle = '#2a1e34'; ctx.fillRect(0, H - GROUND, w, 40);
  drawPillar(P, true); drawArcher(P, true);
  for (const ar of st.arrows) { if (Math.abs(ar.x - P.x) > 600) continue; ctx.save(); ctx.translate(SX(ar.x), SY(ar.y)); ctx.scale(sc, sc); ctx.rotate(Math.atan2(ar.vy, ar.vx)); drawArrowShape(34); ctx.restore(); }
  camX = oc; sc = os;
  ctx.restore();
  ctx.save(); ctx.globalAlpha = insetA;
  ctx.strokeStyle = incoming && Math.sin(st.t * 16) > 0 ? '#ff5a4e' : '#f6eedf'; ctx.lineWidth = 2; ctx.strokeRect(x0, y0, w, h);
  ctx.font = '700 10px Silkscreen, monospace'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(20,10,30,.7)'; ctx.fillRect(x0, y0, incoming ? 78 : 34, 14);
  ctx.fillStyle = incoming ? '#ff5a4e' : '#f6eedf'; ctx.fillText(incoming ? 'INCOMING' : 'YOU', x0 + 4, y0 + 2);
  ctx.restore();
}
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (!st) { st = { t: performance.now() / 1000 }; drawBG(); st = null; return; }
  drawBG();
  for (const it of st.items) drawItem(it);
  drawPillar(st.me, true); drawPillar(st.opp, false);
  for (const p of st.pinned) { ctx.save(); ctx.translate(SX(p.x), SY(p.y)); ctx.scale(sc, sc); ctx.rotate(p.ang); drawArrowShape(26); ctx.restore(); }
  drawArcher(st.me, true); drawArcher(st.opp, false);
  for (const ar of st.arrows) {
    ctx.save(); ctx.translate(SX(ar.x), SY(ar.y)); ctx.scale(sc, sc); ctx.rotate(Math.atan2(ar.vy, ar.vx));
    ctx.strokeStyle = ar.mine ? 'rgba(63,208,201,.5)' : 'rgba(255,90,78,.5)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-36, 0); ctx.lineTo(-100, 0); ctx.stroke();
    drawArrowShape(34); ctx.restore();
  }
  for (const p of st.parts) { ctx.globalAlpha = clamp(p.life / p.max * 1.5, 0, 1); ctx.fillStyle = p.col; ctx.fillRect(SX(p.x), SY(p.y), p.r * Math.max(.8, sc), p.r * Math.max(.8, sc)); }
  ctx.globalAlpha = 1;
  drawPreview();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of st.texts) {
    ctx.globalAlpha = clamp(t.life / t.max * 1.8, 0, 1); ctx.font = `700 ${t.size}px Silkscreen, monospace`;
    ctx.fillStyle = 'rgba(20,10,30,.7)'; ctx.fillText(t.t, SX(t.x) + 1, SY(t.y) + 2);
    ctx.fillStyle = t.col; ctx.fillText(t.t, SX(t.x), SY(t.y));
  }
  ctx.globalAlpha = 1;
  const vg = ctx.createRadialGradient(W / 2, H * .5, Math.min(W, H) * .35, W / 2, H * .5, Math.max(W, H) * .75);
  vg.addColorStop(0, 'rgba(20,10,30,0)'); vg.addColorStop(1, 'rgba(20,10,30,.45)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  drawInset();
  drawHUD();
}
let last = 0;
function frame(ts) {
  const dt = Math.min(.04, (ts - last) / 1000 || 0); last = ts;
  if (st && match && st.phase !== 'over') update(dt);
  if (st && match && match.vs === 'live') pushPresence();
  draw();
  requestAnimationFrame(frame);
}

/* ---------- input ---------- */
let drag = null;
cv.addEventListener('pointerdown', e => {
  if (!st || st.me.dead || (st.phase !== 'fight' && st.phase !== 'countdown')) return;
  drag = { id: e.pointerId, x: e.clientX, y: e.clientY }; st.camHome = true;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
});
cv.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id || !st) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y, len = Math.hypot(dx, dy);
  st.me.pow = clamp(len / 120, 0, 1);
  if (len > 6) st.me.aim = clamp(Math.atan2(-dy, -dx), -1.35, .7);
});
function release() {
  if (drag && st && !st.me.dead) {
    if (st.phase === 'fight' && st.me.pow > .1 && st.reload <= 0) {
      const v = 300 + st.me.pow * 900;
      fire(st.me, st.me.aim, v, true);
      myShots.push({ id: ++shotSeq, r: st.round, a: +st.me.aim.toFixed(4), v: Math.round(v) });
      st.reload = RELOAD; st.camHome = false;
    }
    st.me.pow = 0; pushPresence();
  }
  drag = null;
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', () => { drag = null; if (st) st.me.pow = 0; });
$('homeBtn').onclick = () => { if (st) st.camHome = true; };

/* ---------- sound ---------- */
let AC = null;
const SFX = { twang: ['triangle', 260, 90, .12, .16, .12], hit: ['square', 160, 60, .08, .1, .1], head: ['square', 520, 120, .12, .16, .12],
  thud: ['sine', 120, 50, .08, .1, .1], kill: ['sawtooth', 220, 40, .4, .5, .12], glass: ['triangle', 1800, 900, .12, .16, .08], heal: ['triangle', 500, 1200, .25, .3, .12], wave: ['triangle', 300, 660, .25, .35, .12] };
function sfx(t) {
  if (!AC || AC.state !== 'running') return;
  const P = SFX[t], now = AC.currentTime;
  try {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = P[0]; o.frequency.setValueAtTime(P[1], now); o.frequency.exponentialRampToValueAtTime(P[2], now + P[3]);
    g.gain.setValueAtTime(P[5], now); g.gain.exponentialRampToValueAtTime(.0001, now + P[4]);
    o.connect(g); g.connect(AC.destination); o.start(now); o.stop(now + P[4] + .02);
  } catch (e) {}
}
function unlockAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.resume) AC.resume().catch(() => {});
}
document.addEventListener('pointerdown', unlockAudio);

/* ---------- buttons ---------- */
$('botBtn').onclick = () => { unlockAudio(); newMatch('bot'); };
$('rematchBtn').onclick = () => { if (!match) return; newMatch(match.vs); };
$('lobbyBtn').onclick = () => { match = null; st = null; noAuto = true; toLobby(); lastPres = ''; pushPresence(true); onPeers(); };
$('quitBtn').onclick = () => { match = null; st = null; noAuto = true; toLobby(); lastPres = ''; pushPresence(true); onPeers(); };
$('hostBtn').onclick = () => { unlockAudio(); hostGame(); };
$('joinOpen').onclick = () => { unlockAudio(); show('lobbyMain', false); show('joinBox', true); show('cancelBtn', true); setLobby('Join a game'); try { $('codeIn').focus(); } catch (e) {} };
$('joinBtn').onclick = () => joinGame();
$('codeIn').addEventListener('keydown', e => { if (e.key === 'Enter') joinGame(); });
$('cancelBtn').onclick = () => netReset('Play live against someone on another device, or practise.');

addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
connect();
})();
</script>
