<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f2a4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Stick Duel">
<meta name="mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0}[hidden]{display:none!important}</style>
<title>Stick Duel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Rubik:wght@400;600;800&display=swap">
<style>
/* The menu: Versus, Co-op, Single player. Same dusk theme as the games. */
:root{
  --dusk:#1f2a4a; --ember:#f2a65a; --bone:#f6eedf; --blood:#e23b2e; --muted:#b9b0c8; --teal:#3fd0c9;
  --pixel:'Silkscreen','Courier New',monospace;
  --body:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;background:var(--dusk)}
body{height:100%;margin:0;background:var(--dusk);color:var(--bone);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{position:relative;width:100%;height:100%;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;padding:16px;background:rgba(22,18,38,.8);overflow-y:auto}
.overlay>.panel{margin:auto}   /* centred, but scrolls from the top when the screen is short */
.panel{width:min(420px,100%);display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.title{font-family:var(--pixel);font-weight:700;font-size:clamp(34px,8vw,56px);line-height:.95;margin:0;letter-spacing:.02em;text-wrap:balance}
.title em{font-style:normal;color:var(--blood)}
.status{font-family:var(--pixel);font-size:14px;color:var(--ember);margin:0;min-height:1.4em}
.small{font-size:13px;color:var(--muted);margin:0;max-width:40ch;line-height:1.4}
.btn{font-family:var(--pixel);font-weight:700;font-size:18px;letter-spacing:.06em;color:#24150a;background:var(--ember);border:0;padding:13px 28px;cursor:pointer}
.btn.alt{background:#5d5478;color:var(--bone);font-size:14px;padding:10px 20px}
.btn:active{transform:translateY(2px)}
.btn:focus-visible{outline:3px solid var(--blood);outline-offset:3px}
.menu{display:flex;flex-direction:column;gap:12px;width:min(340px,100%)}
.menu .btn{text-decoration:none;display:block}
.menu .btn small{display:block;font:400 12px var(--body);letter-spacing:0;margin-top:4px;opacity:.8}
@media (orientation:landscape) and (max-height:520px){.overlay>.panel{width:min(780px,100%)}.menu{flex-direction:row;width:100%}.menu .btn{flex:1;padding:12px 10px}.title{font-size:clamp(30px,7vh,44px)}}
</style>
</head>
<body>
<div id="app">
  <div class="overlay">
    <div class="panel">
      <h1 class="title">STICK <em>DUEL</em></h1>
      <div class="menu">
        <a class="btn" href="coop.html?vs">⚔ VERSUS<small>2 to 4 players, everyone for themselves. Or practise against bots.</small></a>
        <a class="btn" href="coop.html">🤝 CO-OP<small>Team up against the enemy archers.</small></a>
        <a class="btn" href="solo.html">▶ SINGLE PLAYER<small>Level after level, bosses and the horde.</small></a>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
        <button class="btn alt" id="shareBtn" type="button" style="font-size:12px;padding:9px 14px">SHARE GAME</button>
        <button class="btn alt" id="installBtn" type="button" data-install style="font-size:12px;padding:9px 14px">ADD TO HOME SCREEN</button>
      </div>
    </div>
  </div>
</div>
<script src="share.js"></script>
<script>
document.getElementById('shareBtn').onclick = () => StickShare.shareGame();
document.getElementById('installBtn').onclick = () => StickShare.install();
// old versus invite links (index.html?join=CODE) go to the new versus
try { const j = new URLSearchParams(location.search).get('join'); if (j) location.replace('coop.html?join=' + encodeURIComponent(j)); } catch (e) {}
</script>
</body>
</html>
